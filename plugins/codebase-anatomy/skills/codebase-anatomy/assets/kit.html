<title>PROJECT NAME · 해부도</title>

<!--
  codebase-anatomy kit
  이 파일을 복사해서 채워 쓰세요.
  - CSS: 그대로 두기 (라이트/다크 3상태 + 모바일 검증됨)
  - 마크업: <section id="..." data-nav="..."> 로 장을 추가
  - 데이터: 아래 DATA 블록의 배열을 채우기
  - 장 번호와 상호참조({{sectionId}})는 런타임에 자동 계산됨
  - 화면 껍데기(as-shell: 지도 · 장 읽기 · 결함 보드 · 퀴즈 · 용어)는 여기에 쓰지 않음.
    다 채운 뒤 node scripts/upgrade.js <파일> --key <프로젝트-slug>-anatomy 가 넣는다
-->

<style>
  :root {
    --paper:#EDEBE5; --surface:#F6F5F1; --surface-2:#E4E1D9;
    --ink:#171A1C; --ink-soft:#4B5254; --ink-faint:#7A8083;
    --rule:#C6C4BC; --rule-soft:#DAD8D1;
    --signal:#0B6E62; --signal-bg:#DDEAE6;
    --alert:#AF4023;  --alert-bg:#F3E0DA;
    --warn:#8E6410;   --warn-bg:#F0E7D2;
    --code-bg:#E4E2DA;
    --shadow:0 1px 2px rgba(23,26,28,.06), 0 8px 24px -12px rgba(23,26,28,.18);
    --mono: ui-monospace,"SFMono-Regular","SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"D2Coding",monospace;
    --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
    --measure:68ch; --wide:1080px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#141719; --surface:#1C2023; --surface-2:#262B2E;
      --ink:#E7E6E1; --ink-soft:#A9AFB1; --ink-faint:#767D80;
      --rule:#31383C; --rule-soft:#262C30;
      --signal:#4FD1BC; --signal-bg:#14312D;
      --alert:#E8836A;  --alert-bg:#35201A;
      --warn:#D7A33F;   --warn-bg:#32280F;
      --code-bg:#101315;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --paper:#141719; --surface:#1C2023; --surface-2:#262B2E;
    --ink:#E7E6E1; --ink-soft:#A9AFB1; --ink-faint:#767D80;
    --rule:#31383C; --rule-soft:#262C30;
    --signal:#4FD1BC; --signal-bg:#14312D;
    --alert:#E8836A;  --alert-bg:#35201A;
    --warn:#D7A33F;   --warn-bg:#32280F;
    --code-bg:#101315;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }

  * { box-sizing:border-box; }
  body {
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.75; margin:0;
    -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere;
  }
  ::selection { background:var(--signal); color:var(--paper); }
  :focus-visible { outline:2px solid var(--signal); outline-offset:3px; border-radius:2px; }

  .shell { display:grid; grid-template-columns:210px minmax(0,1fr); max-width:1400px; margin:0 auto; }

  .rail {
    position:sticky; top:0; align-self:start; height:100vh;
    padding:40px 0 40px 28px; border-right:1px solid var(--rule);
    display:flex; flex-direction:column; gap:22px; overflow-y:auto;
  }
  .rail-brand { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); line-height:1.5; padding-right:20px; }
  .rail-nav { display:flex; flex-direction:column; gap:1px; }
  .rail-link {
    position:relative; display:grid; grid-template-columns:26px 1fr; align-items:baseline; gap:8px;
    padding:5px 16px 5px 0; font-family:var(--mono); font-size:11.5px;
    color:var(--ink-faint); text-decoration:none; border:0; background:none;
    text-align:left; cursor:pointer; transition:color .18s;
  }
  .rail-link .tk { color:var(--rule); transition:color .18s; }
  .rail-link:hover { color:var(--ink); }
  .rail-link:hover .tk { color:var(--signal); }
  .rail-link[aria-current="true"] { color:var(--ink); font-weight:600; }
  .rail-link[aria-current="true"] .tk { color:var(--signal); }
  .rail-link[aria-current="true"]::before { content:""; position:absolute; left:-29px; top:50%; width:20px; height:1px; background:var(--signal); transform:translateY(-50%); }
  .rail-foot { margin-top:auto; padding-right:20px; font-family:var(--mono); font-size:10px; color:var(--ink-faint); line-height:1.7; }
  .theme-btn { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; background:none; border:1px solid var(--rule); color:var(--ink-soft); padding:5px 10px; cursor:pointer; margin-bottom:12px; transition:border-color .18s,color .18s; }
  .theme-btn:hover { border-color:var(--signal); color:var(--signal); }

  .main { padding:0 48px 140px; min-width:0; }
  .col { max-width:var(--measure); }
  .wide { max-width:var(--wide); }
  section { padding-top:88px; scroll-margin-top:24px; }

  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--signal); margin:0 0 14px; display:flex; align-items:center; gap:10px; }
  .eyebrow::after { content:""; flex:1; height:1px; background:var(--rule); }

  h1 { font-size:clamp(38px,6vw,66px); line-height:1.04; letter-spacing:-.03em; font-weight:800; margin:0 0 24px; text-wrap:balance; }
  h2 { font-size:clamp(25px,3.2vw,34px); line-height:1.2; letter-spacing:-.022em; font-weight:750; margin:0 0 18px; text-wrap:balance; }
  h3 { font-size:18.5px; line-height:1.4; letter-spacing:-.012em; font-weight:700; margin:40px 0 12px; text-wrap:balance; }
  h4 { font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin:0 0 10px; }
  p { margin:0 0 18px; }
  .lead { font-size:19px; line-height:1.7; color:var(--ink-soft); margin-bottom:28px; }
  strong { font-weight:700; color:var(--ink); }
  a { color:var(--signal); text-underline-offset:3px; }

  code,.m { font-family:var(--mono); font-size:.875em; background:var(--code-bg); padding:.12em .38em; border-radius:2px; letter-spacing:-.01em; }
  .path { font-family:var(--mono); font-size:12px; color:var(--ink-faint); letter-spacing:-.01em; background:none; padding:0; }
  .path b { color:var(--signal); font-weight:600; }

  ul,ol { margin:0 0 18px; padding-left:22px; }
  li { margin-bottom:8px; }
  li::marker { color:var(--ink-faint); }

  .hero { padding-top:76px; }
  .hero-sub { font-family:var(--mono); font-size:12.5px; color:var(--ink-faint); letter-spacing:.02em; margin-bottom:30px; }
  .hero-note { border-left:2px solid var(--signal); padding:2px 0 2px 20px; margin:0 0 44px; color:var(--ink-soft); max-width:60ch; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-bottom:8px; }
  .stat { background:var(--surface); padding:16px 18px 14px; }
  .stat-n { font-family:var(--mono); font-size:25px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; display:block; line-height:1.1; }
  .stat-l { font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--ink-faint); text-transform:uppercase; margin-top:6px; display:block; }
  .stats-cap { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.03em; }

  .panel { border:1px solid var(--rule); background:var(--surface); margin:28px 0; }
  .panel-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:11px 16px; border-bottom:1px solid var(--rule); background:var(--surface-2); }
  .panel-title { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  .panel-meta { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-left:auto; font-variant-numeric:tabular-nums; }

  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { font-family:var(--mono); font-size:11.5px; padding:6px 12px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .15s; white-space:nowrap; }
  .tab:hover { border-color:var(--signal); color:var(--ink); }
  .tab[aria-selected="true"] { background:var(--signal); border-color:var(--signal); color:var(--paper); font-weight:600; }

  .lx { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); }
  @media (max-width:860px){ .lx{ grid-template-columns:1fr; } }
  .lx-stack { border-right:1px solid var(--rule); padding:16px; display:flex; flex-direction:column; gap:4px; }
  @media (max-width:860px){ .lx-stack{ border-right:0; border-bottom:1px solid var(--rule); } }
  .lx-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; width:100%; padding:11px 13px; border:1px solid var(--rule-soft); background:var(--paper); cursor:pointer; text-align:left; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); transition:all .15s; }
  .lx-row:hover { border-color:var(--signal); color:var(--ink); }
  .lx-row[aria-selected="true"] { border-color:var(--signal); background:var(--signal-bg); color:var(--ink); font-weight:600; }
  .lx-row .cnt { font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .lx-row[aria-selected="true"] .cnt { color:var(--signal); }
  .lx-arrow { text-align:center; font-family:var(--mono); font-size:13px; color:var(--rule); line-height:1; margin:-1px 0; user-select:none; }
  .lx-detail { padding:18px 18px 22px; min-width:0; }
  .lx-detail h5 { font-family:var(--mono); font-size:15px; margin:0 0 4px; letter-spacing:-.01em; font-weight:700; }
  .lx-role { font-size:14px; color:var(--ink-soft); margin-bottom:16px; line-height:1.65; }
  .lx-kv { display:grid; grid-template-columns:76px 1fr; gap:7px 12px; font-size:13px; align-items:baseline; }
  .lx-kv dt { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); padding-top:2px; }
  .lx-kv dd { margin:0; color:var(--ink-soft); line-height:1.6; }
  .lx-files { margin-top:16px; display:flex; flex-wrap:wrap; gap:4px; }
  .lx-file { font-family:var(--mono); font-size:10.5px; padding:3px 7px; background:var(--code-bg); color:var(--ink-soft); border-radius:2px; }

  .tr-controls { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
  .btn { font-family:var(--mono); font-size:11.5px; padding:6px 13px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .15s; }
  .btn:hover:not(:disabled) { border-color:var(--signal); color:var(--signal); }
  .btn:disabled { opacity:.38; cursor:not-allowed; }
  .btn-go { background:var(--signal); border-color:var(--signal); color:var(--paper); font-weight:600; }
  .btn-go:hover:not(:disabled) { color:var(--paper); opacity:.88; }
  .tr-count { font-family:var(--mono); font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; margin-left:auto; }
  .tr-body { display:grid; grid-template-columns:250px minmax(0,1fr); }
  @media (max-width:900px){ .tr-body{ grid-template-columns:1fr; } }
  .tr-steps { border-right:1px solid var(--rule); padding:12px; display:flex; flex-direction:column; gap:2px; }
  @media (max-width:900px){ .tr-steps{ border-right:0; border-bottom:1px solid var(--rule); } }
  .tr-step { display:grid; grid-template-columns:20px 1fr; gap:9px; align-items:start; padding:8px 10px; border:1px solid transparent; background:none; cursor:pointer; text-align:left; font-family:var(--mono); font-size:11.5px; line-height:1.5; color:var(--ink-faint); transition:all .15s; }
  .tr-step:hover { color:var(--ink); background:var(--surface-2); }
  .tr-step[aria-selected="true"] { border-color:var(--signal); background:var(--signal-bg); color:var(--ink); font-weight:600; }
  .tr-step .n { font-variant-numeric:tabular-nums; color:var(--rule); padding-top:1px; }
  .tr-step[aria-selected="true"] .n, .tr-step.done .n { color:var(--signal); }
  .tr-view { padding:20px 20px 24px; min-width:0; }
  .tr-where { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:4px 9px; background:var(--surface-2); color:var(--ink-soft); margin-bottom:12px; border-radius:2px; }
  .tr-where .dot { width:6px; height:6px; border-radius:50%; background:var(--signal); }
  .tr-where.front .dot { background:var(--warn); }
  .tr-where.rt .dot { background:var(--alert); }
  .tr-where.ext .dot { background:var(--ink-faint); }
  .tr-title { font-size:18px; font-weight:700; margin:0 0 8px; letter-spacing:-.015em; line-height:1.35; }
  .tr-desc { font-size:14.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 16px; }
  .tr-file { font-family:var(--mono); font-size:11.5px; color:var(--signal); margin-bottom:10px; word-break:break-all; }

  pre { margin:0 0 14px; background:var(--code-bg); border:1px solid var(--rule-soft); padding:13px 15px; overflow-x:auto; font-family:var(--mono); font-size:12px; line-height:1.65; color:var(--ink); letter-spacing:-.01em; }
  pre code { background:none; padding:0; font-size:inherit; }
  .cmt { color:var(--ink-faint); }

  .tr-note { font-size:13.5px; line-height:1.7; padding:11px 14px; background:var(--signal-bg); border-left:2px solid var(--signal); color:var(--ink-soft); }
  .tr-note b { color:var(--ink); }

  .fx { display:flex; flex-direction:column; gap:1px; background:var(--rule); border:1px solid var(--rule); }
  .fx-item { background:var(--surface); }
  .fx-btn { width:100%; display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; gap:12px; padding:13px 16px; background:none; border:0; cursor:pointer; text-align:left; color:var(--ink); font-family:var(--sans); font-size:14.5px; line-height:1.5; transition:background .15s; }
  .fx-btn:hover { background:var(--surface-2); }
  .fx-id { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .sev { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px; font-weight:600; border-radius:2px; white-space:nowrap; }
  .sev.high { background:var(--alert-bg); color:var(--alert); }
  .sev.mid { background:var(--warn-bg); color:var(--warn); }
  .sev.low { background:var(--surface-2); color:var(--ink-faint); }
  .fx-tog { font-family:var(--mono); font-size:15px; color:var(--ink-faint); line-height:1; }
  .fx-panel { display:none; padding:0 16px 20px; }
  .fx-item.open .fx-panel { display:block; }
  .fx-item.open .fx-tog { color:var(--signal); }
  .fx-panel h6 { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:16px 0 7px; font-weight:600; }
  .fx-panel p { font-size:14px; margin:0; color:var(--ink-soft); line-height:1.7; }

  .erd { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
  .erd-g { background:var(--surface); padding:15px 16px 17px; }
  .erd-g h5 { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin:0 0 4px; color:var(--signal); font-weight:600; }
  .erd-g .cap { font-size:12.5px; color:var(--ink-faint); margin:0 0 11px; line-height:1.55; }
  .erd-g ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; }
  .erd-g li { font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin:0; }
  .erd-g li b { color:var(--ink); font-weight:600; }

  .callout { border:1px solid var(--rule); border-left:2px solid var(--signal); background:var(--surface); padding:17px 20px; margin:26px 0; }
  .callout.warn { border-left-color:var(--warn); }
  .callout.alert { border-left-color:var(--alert); }
  .callout p:last-child { margin-bottom:0; }
  .callout h4 { color:var(--signal); }
  .callout.warn h4 { color:var(--warn); }
  .callout.alert h4 { color:var(--alert); }

  .term { border:0; background:none; padding:0; font:inherit; color:inherit; cursor:help; border-bottom:1px dashed var(--signal); }
  .term:hover { background:var(--signal-bg); }
  #pop { position:absolute; z-index:60; max-width:330px; background:var(--surface); border:1px solid var(--signal); padding:12px 14px; box-shadow:var(--shadow); font-size:13.5px; line-height:1.65; color:var(--ink-soft); display:none; }
  #pop.on { display:block; }
  #pop b { display:block; font-family:var(--mono); font-size:11.5px; color:var(--signal); margin-bottom:5px; }

  .tw { overflow-x:auto; margin:22px 0; border:1px solid var(--rule); }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
  th { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); font-weight:600; white-space:nowrap; }
  td { color:var(--ink-soft); }
  tr:last-child td { border-bottom:0; }
  td .m { font-size:11.5px; }

  .split { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin:26px 0; }
  .split > div { background:var(--surface); padding:17px 18px 19px; }
  .split h4 { margin-bottom:8px; }
  .split p { font-size:13.5px; margin:0; color:var(--ink-soft); line-height:1.68; }

  /* ---- concept cards ---- */
  .cc { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
  .cc-card { background:var(--surface); padding:0; }
  .cc-btn { width:100%; text-align:left; background:none; border:0; padding:15px 17px; cursor:pointer; color:var(--ink); font-family:var(--sans); transition:background .15s; }
  .cc-btn:hover { background:var(--surface-2); }
  .cc-btn .k { display:block; font-family:var(--mono); font-size:12.5px; color:var(--signal); font-weight:600; margin-bottom:5px; }
  .cc-btn .s { display:block; font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .cc-card .body { display:none; padding:0 17px 18px; }
  .cc-card.open .body { display:block; }
  .cc-card .body p { font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }
  .cc-card .body pre { font-size:11.5px; margin-bottom:0; }

  /* ---- calculator ---- */
  .calc { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  @media (max-width:880px){ .calc{ grid-template-columns:1fr; } }
  .calc-in { padding:18px; border-right:1px solid var(--rule); display:flex; flex-direction:column; gap:14px; }
  @media (max-width:880px){ .calc-in{ border-right:0; border-bottom:1px solid var(--rule); } }
  .fld { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline; }
  .fld label { font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .fld .val { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--signal); font-variant-numeric:tabular-nums; }
  .fld input[type=range] { grid-column:1/-1; width:100%; accent-color:var(--signal); height:20px; }
  .seg { display:flex; gap:4px; }
  .seg button { flex:1; font-family:var(--mono); font-size:11px; padding:6px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:all .15s; }
  .seg button[aria-pressed="true"] { background:var(--signal); border-color:var(--signal); color:var(--paper); font-weight:600; }
  .calc-out { padding:18px; min-width:0; }
  .score-hero { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .score-n { font-family:var(--mono); font-size:52px; font-weight:700; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .score-max { font-family:var(--mono); font-size:14px; color:var(--ink-faint); }
  .score-meta { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  .pill { font-family:var(--mono); font-size:11px; padding:4px 10px; background:var(--signal-bg); color:var(--signal); font-weight:600; border-radius:2px; }
  .pill.g { background:var(--surface-2); color:var(--ink-soft); }
  .bar-row { display:grid; grid-template-columns:96px 1fr 52px; gap:10px; align-items:center; margin-bottom:7px; font-family:var(--mono); font-size:10.5px; }

  // { tab:"정상 토큰", h:"헤더b64", p:"페이로드b64", s:"서명",
  //   hj:"디코드된 헤더", pj:"디코드된 페이로드",
  //   hn:"헤더 설명", pn:"페이로드 설명", sn:"서명 설명",
  //   ok:true, msg:"판정 문구 (HTML)" },
];

/* 공격 시나리오. k: bad|mid|ok, out: safe|risk */
var ATTACKS = [
  // { tab:"XSS", title:"제목", steps:[
  //     { k:"bad", ic:"공격", h:"단계 제목", p:"설명(HTML)", c:"코드" }
  //   ], out:"risk", msg:"현재 상태 판정 (HTML)" },
];

/* 계산기: 프로젝트마다 공식이 달라 kit 이 자동 렌더하지 않습니다.
   순수 산술 코어가 있을 때만, 소스에서 그대로 옮긴 compute() 를 직접 작성해
   #calcIn / #calcOut 에 붙이세요. 근사치는 넣지 말 것. */
</script>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function $(id) { return document.getElementById(id); }
  function has(id, data) {
    if (!$(id)) return false;
    if (!data) return true;
    return Array.isArray(data) ? data.length > 0 : Object.keys(data).length > 0;
  }

  var sections = Array.prototype.slice.call(document.querySelectorAll("section[data-nav]"));

  /* ---------- chapter numbers + {{xref}} ---------- */
  var chapNo = {};
  sections.forEach(function (sec, i) { chapNo[sec.id] = String(i).padStart(2, "0"); });

  function resolveStr(s) {
    return s.replace(/\{\{([A-Za-z0-9_]+)\}\}/g, function (w, id) {
      return chapNo[id] !== undefined ? chapNo[id] : w;
    });
  }
  (function deepResolve(v) {
    if (Array.isArray(v)) { v.forEach(deepResolve); return; }
    if (v && typeof v === "object") {
      Object.keys(v).forEach(function (k) {
        if (typeof v[k] === "string") v[k] = resolveStr(v[k]);
        else deepResolve(v[k]);
      });
    }
  })([LAYERS, SEC, CONCEPTS, TRACES, FINDINGS, GOOD, ERD, APIMAP, GLOSSARY, QUIZ, JWTS, ATTACKS, STATS, TIMELINE]);

  /* ---------- {{xref}} in static markup ---------- */
  (function (root) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), hits = [], n;
    while ((n = w.nextNode())) if (n.nodeValue.indexOf("{{") !== -1) hits.push(n);
    hits.forEach(function (x) { x.nodeValue = resolveStr(x.nodeValue); });
  })(document.body);

  /* eyebrow 번호는 섹션 순서에서 자동 생성 */
  sections.forEach(function (sec, i) {
    var eb = sec.querySelector(".eyebrow");
    if (!eb) return;
    eb.textContent = String(i).padStart(2, "0") + " — " + eb.textContent.replace(/^\s*\d+\s*—\s*/, "").trim();
  });

  /* ---------- rail nav ---------- */
  var navHost = $("railNav"), navLinks = [];
  if (navHost) {
    sections.forEach(function (sec, i) {
      var a = el("a", "rail-link");
      a.href = "#" + sec.id;
      a.innerHTML = '<span class="tk">' + String(i).padStart(2, "0") + "</span><span>" + sec.dataset.nav + "</span>";
      navHost.appendChild(a); navLinks.push(a);
    });
    if (typeof IntersectionObserver === "function") {
      var obs = new IntersectionObserver(function (es) {
        es.forEach(function (en) {
          if (!en.isIntersecting) return;
          var idx = sections.indexOf(en.target);
          navLinks.forEach(function (l, i) { l.setAttribute("aria-current", i === idx ? "true" : "false"); });
        });
      }, { rootMargin: "-20% 0px -70% 0px" });
      sections.forEach(function (s) { obs.observe(s); });
    }
  }

  /* ---------- theme ---------- */
  if ($("themeBtn")) {
    $("themeBtn").addEventListener("click", function () {
      var r = document.documentElement, cur = r.getAttribute("data-theme");
      if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    });
  }

  /* ---------- stats ---------- */
  if (has("stats", STATS)) {
    STATS.forEach(function (s) {
      $("stats").appendChild(el("div", "stat",
        '<span class="stat-n">' + esc(s[0]) + '</span><span class="stat-l">' + esc(s[1]) + "</span>"));
    });
  }

  /* ---------- layer / filter stacks ---------- */
  function buildStack(stackId, detailId, data) {
    if (!has(stackId, data) || !$(detailId)) return;
    var host = $(stackId), detail = $(detailId), rows = [];
    data.forEach(function (L, i) {
      var b = el("button", "lx-row");
      b.type = "button"; b.setAttribute("role", "option");
      b.innerHTML = "<span>" + esc(L.name) + "</span><span class='cnt'>" +
                    (typeof L.n === "number" ? L.n + " files" : esc(L.n || "")) + "</span>";
      b.addEventListener("click", function () { select(i); });
      host.appendChild(b); rows.push(b);
      if (i < data.length - 1) host.appendChild(el("div", "lx-arrow", "↓"));
    });
    function select(i) {
      rows.forEach(function (r, j) { r.setAttribute("aria-selected", j === i ? "true" : "false"); });
      var L = data[i];
      detail.innerHTML = "<h5>" + esc(L.name) + "</h5><p class='lx-role'>" + esc(L.role) + "</p>" +
        "<dl class='lx-kv'><dt>부르는 곳</dt><dd>" + esc(L.calls) + "</dd>" +
        "<dt>핵심 규칙</dt><dd>" + esc(L.rule) + "</dd></dl>" +
        "<div class='lx-files'>" + (L.files || []).map(function (f) {
          return "<span class='lx-file'>" + esc(f) + "</span>"; }).join("") + "</div>";
    }
    select(0);
  }
  buildStack("lxStack", "lxDetail", LAYERS);
  buildStack("secStack", "secDetail", SEC);

  /* ---------- concept cards ---------- */
  if (has("cc", CONCEPTS)) {
    CONCEPTS.forEach(function (C) {
      var card = el("div", "cc-card");
      var btn = el("button", "cc-btn", "<span class='k'>" + esc(C.k) + "</span><span class='s'>" + esc(C.s) + "</span>");
      btn.type = "button"; btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("click", function () {
        btn.setAttribute("aria-expanded", card.classList.toggle("open") ? "true" : "false");
      });
      card.appendChild(btn); card.appendChild(el("div", "body", C.b)); $("cc").appendChild(card);
    });
  }

  /* ---------- request tracer ---------- */
  var stopTracer = function () {};
  if (has("trTabs", TRACES) && $("trSteps") && $("trView")) {
    var trTabs = $("trTabs"), trSteps = $("trSteps"), trView = $("trView"),
        trCount = $("trCount"), trPrev = $("trPrev"), trNext = $("trNext"), trPlay = $("trPlay");
    var curT = 0, curS = 0, timer = null;

    TRACES.forEach(function (T, i) {
      var b = el("button", "tab", esc(T.tab));
      b.type = "button"; b.setAttribute("role", "tab");
      b.addEventListener("click", function () { stop(); curT = i; curS = 0; renderTrace(); });
      trTabs.appendChild(b);
    });
    function stop() { if (timer) { clearInterval(timer); timer = null; } if (trPlay) trPlay.textContent = "▶ 재생"; }
    stopTracer = stop;
    function renderTrace() {
      Array.prototype.forEach.call(trTabs.children, function (b, i) { b.setAttribute("aria-selected", i === curT ? "true" : "false"); });
      trSteps.innerHTML = "";
      TRACES[curT].steps.forEach(function (s, i) {
        var b = el("button", "tr-step");
        b.type = "button"; b.setAttribute("role", "option");
        b.innerHTML = "<span class='n'>" + String(i + 1).padStart(2, "0") + "</span><span>" + esc(s.t) + "</span>";
        b.addEventListener("click", function () { stop(); curS = i; renderStep(); });
        trSteps.appendChild(b);
      });
      renderStep();
    }
    function renderStep() {
      var T = TRACES[curT], s = T.steps[curS];
      Array.prototype.forEach.call(trSteps.children, function (b, i) {
        b.setAttribute("aria-selected", i === curS ? "true" : "false");
        b.classList.toggle("done", i < curS);
      });
      trView.innerHTML =
        "<span class='tr-where " + s.w + "'><span class='dot'></span>" + esc(s.wl) + "</span>" +
        "<h3 class='tr-title'>" + esc(s.t) + "</h3>" +
        "<div class='tr-file'>" + esc(s.f) + "</div>" +
        "<p class='tr-desc'>" + esc(s.d) + "</p>" +
        "<pre><code>" + esc(s.c) + "</code></pre>" +
        (s.note ? "<div class='tr-note'>" + s.note + "</div>" : "");
      if (trCount) trCount.textContent = (curS + 1) + " / " + T.steps.length;
      if (trPrev) trPrev.disabled = curS === 0;
      if (trNext) trNext.disabled = curS === T.steps.length - 1;
      var a = trSteps.children[curS];
      if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest" });
    }
    if (trPrev) trPrev.addEventListener("click", function () { stop(); if (curS > 0) { curS--; renderStep(); } });
    if (trNext) trNext.addEventListener("click", function () { stop(); if (curS < TRACES[curT].steps.length - 1) { curS++; renderStep(); } });
    if (trPlay) trPlay.addEventListener("click", function () {
      if (timer) { stop(); return; }
      if (curS >= TRACES[curT].steps.length - 1) { curS = 0; renderStep(); }
      trPlay.textContent = "❚❚ 정지";
      timer = setInterval(function () {
        if (curS >= TRACES[curT].steps.length - 1) { stop(); return; }
        curS++; renderStep();
      }, 4600);
    });
    renderTrace();
  }

  /* ---------- findings ---------- */
  if (has("fx", FINDINGS)) {
    FINDINGS.forEach(function (F) {
      var item = el("div", "fx-item"), btn = el("button", "fx-btn");
      btn.type = "button"; btn.setAttribute("aria-expanded", "false");
      btn.innerHTML = "<span class='fx-id'>" + esc(F.id) + "</span><span class='sev " + F.sev + "'>" +
                      esc(F.sevL) + "</span><span>" + esc(F.t) + "</span><span class='fx-tog'>+</span>";
      var panel = el("div", "fx-panel",
        "<h6>근거</h6><div class='tr-file'>" + esc(F.ev) + "</div><pre><code>" + esc(F.code) + "</code></pre>" +
        "<h6>무엇이 문제인가</h6><p>" + esc(F.what) + "</p>" +
        "<h6>왜 중요한가</h6><p>" + esc(F.why) + "</p>" +
        "<h6>어떻게 고치나</h6><p>" + esc(F.fix) + "</p>");
      btn.addEventListener("click", function () {
        var open = item.classList.toggle("open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.querySelector(".fx-tog").textContent = open ? "−" : "+";
      });
      item.appendChild(btn); item.appendChild(panel); $("fx").appendChild(item);
    });
  }

  /* ---------- good / erd / apimap / glossary ---------- */
  if (has("good", GOOD)) GOOD.forEach(function (G) {
    $("good").appendChild(el("div", null, "<h4>" + esc(G.h) + "</h4><p>" + G.p + "</p>"));
  });

  if (has("erd", ERD)) ERD.forEach(function (G) {
    $("erd").appendChild(el("div", "erd-g", "<h5>" + esc(G.g) + "</h5><p class='cap'>" + esc(G.cap) +
      "</p><ul>" + G.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>"));
  });

  if (has("apimap", APIMAP)) APIMAP.forEach(function (r) {
    var tr = el("tr");
    tr.innerHTML = "<td><span class='m'>" + r[0] + "</span></td><td><span class='m'>" + r[1] +
                   "</span></td><td>" + r[2] + "</td><td>" + r[3] + "</td>";
    $("apimap").appendChild(tr);
  });

  if (has("glossary", GLOSSARY)) Object.keys(GLOSSARY).forEach(function (k) {
    var tr = el("tr");
    tr.innerHTML = "<td><span class='m'>" + esc(k) + "</span></td><td>" + esc(GLOSSARY[k]) + "</td>";
    $("glossary").appendChild(tr);
  });

  /* ---------- timeline ---------- */
  if (has("tl", TIMELINE)) {
    var max = Math.max.apply(null, TIMELINE.map(function (t) { return t.n; })) || 1;
    TIMELINE.forEach(function (T) {
      var row = el("div", "tl-row" + (T.peak ? " peak" : "") + (T.evt ? " evt" : ""));
      row.innerHTML = "<span class='tl-m'>" + esc(T.m) + "</span><span class='tl-bar'>" +
        "<span class='bar-track' style='border:0;background:none;height:11px'>" +
        "<span class='tl-fill' style='display:block;width:" + (T.n / max * 100).toFixed(1) + "%'></span></span>" +
        "<span class='tl-n'>" + T.n + "</span></span>";
      $("tl").appendChild(row);
    });
  }

  /* ---------- token decoder ---------- */
  if (has("jwtTabs", JWTS) && $("jwtBox")) {
    JWTS.forEach(function (J, i) {
      var b = el("button", "tab", esc(J.tab));
      b.type = "button"; b.setAttribute("role", "tab");
      b.addEventListener("click", function () { showJwt(i); });
      $("jwtTabs").appendChild(b);
    });
    var showJwt = function (i) {
      Array.prototype.forEach.call($("jwtTabs").children, function (b, k) { b.setAttribute("aria-selected", k === i ? "true" : "false"); });
      var J = JWTS[i];
      $("jwtBox").innerHTML =
        "<div class='jwt-tok'><span class='jp h'>" + J.h + "</span>.<span class='jp p'>" + J.p +
        "</span>.<span class='jp s'>" + J.s + "</span></div>" +
        "<div class='jwt-parts'>" +
          "<div class='jwt-part h'><h6>① 헤더</h6><pre><code>" + esc(J.hj) + "</code></pre><p class='note'>" + J.hn + "</p></div>" +
          "<div class='jwt-part p'><h6>② 내용</h6><pre><code>" + esc(J.pj) + "</code></pre><p class='note'>" + J.pn + "</p></div>" +
          "<div class='jwt-part s'><h6>③ 서명</h6><pre><code>" + esc(J.s.slice(0, 22) + "…") + "</code></pre><p class='note'>" + J.sn + "</p></div>" +
        "</div><div class='jwt-verdict " + (J.ok ? "ok" : "bad") + "'><span class='ic'>" +
        (J.ok ? "OK" : "X") + "</span><span>" + J.msg + "</span></div>";
    };
    showJwt(0);
  }

  /* ---------- attack scenarios ---------- */
  if (has("atkTabs", ATTACKS) && $("atkBox")) {
    ATTACKS.forEach(function (A, i) {
      var b = el("button", "tab", esc(A.tab));
      b.type = "button"; b.setAttribute("role", "tab");
      b.addEventListener("click", function () { showAtk(i); });
      $("atkTabs").appendChild(b);
    });
    var showAtk = function (i) {
      Array.prototype.forEach.call($("atkTabs").children, function (b, k) { b.setAttribute("aria-selected", k === i ? "true" : "false"); });
      var A = ATTACKS[i];
      $("atkBox").innerHTML = "<div class='atk-steps'>" + A.steps.map(function (s) {
        return "<div class='atk-s " + s.k + "'><span class='ic'>" + esc(s.ic) + "</span><div><h6>" +
               esc(s.h) + "</h6><p>" + s.p + "</p>" + (s.c ? "<pre><code>" + esc(s.c) + "</code></pre>" : "") + "</div></div>";
      }).join("") + "</div><div class='atk-out " + A.out + "'>" + A.msg + "</div>";
    };
    showAtk(0);
  }

  /* ---------- quiz ---------- */
  if (has("qz", QUIZ)) {
    var answered = 0, correct = 0, MARKS = ["A", "B", "C", "D"];
    var paintScore = function () {
      if (!$("qzScore")) return;
      var msg;
      if (answered === 0) msg = "답을 먼저 정한 뒤 눌러보세요";
      else if (answered < QUIZ.length) msg = (QUIZ.length - answered) + "문항 남음";
      else if (correct === QUIZ.length) msg = "전부 맞혔습니다.";
      else if (correct >= QUIZ.length * 0.8) msg = "충분히 설명할 수 있는 수준입니다.";
      else msg = "틀린 문항의 장을 다시 보세요.";
      $("qzScore").innerHTML = "<span class='n'>" + correct + "</span><span class='l'>/ " +
                               QUIZ.length + " 정답</span><span class='msg'>" + msg + "</span>";
    };
    paintScore();
    QUIZ.forEach(function (Q, i) {
      var item = el("div", "qz-item");
      item.innerHTML = "<div class='qz-q'><span class='qz-n'>" + String(i + 1).padStart(2, "0") +
                       "</span><span class='qz-t'>" + esc(Q.q) + "</span></div>";
      var opts = el("div", "qz-opts"), buttons = [];
      Q.o.forEach(function (text, j) {
        var b = el("button", "qz-opt", "<span class='mk'>" + MARKS[j] + "</span><span>" + esc(text) + "</span>");
        b.type = "button";
        b.addEventListener("click", function () {
          if (item.classList.contains("done")) return;
          item.classList.add("done"); answered++;
          if (j === Q.a) correct++;
          buttons.forEach(function (bb, k) {
            bb.disabled = true;
            if (k === Q.a) bb.classList.add("right");
            else if (k === j) bb.classList.add("wrong");
          });
          paintScore();
        });
        opts.appendChild(b); buttons.push(b);
      });
      item.appendChild(opts);
      item.appendChild(el("div", "qz-ans", Q.e + "<span class='src'>" + esc(Q.src) + "</span>"));
      $("qz").appendChild(item);
    });
  }

  /* ---------- glossary popover ---------- */
  var pop = $("pop");
  function hidePop() { if (pop) pop.classList.remove("on"); }
  if (pop) {
    document.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest(".term") : null;
      if (!t) { hidePop(); return; }
      e.preventDefault();
      var def = GLOSSARY[t.dataset.t];
      if (!def) { hidePop(); return; }
      pop.innerHTML = "<b>" + esc(t.dataset.t) + "</b>" + esc(def);
      pop.classList.add("on");
      var r = t.getBoundingClientRect();
      pop.style.top = (window.scrollY + r.bottom + 8) + "px";
      pop.style.left = Math.max(8, Math.min(window.scrollX + r.left,
        window.scrollX + document.documentElement.clientWidth - 350)) + "px";
    });
    window.addEventListener("scroll", hidePop, { passive: true });
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { hidePop(); stopTracer(); } });

})();
</script>
