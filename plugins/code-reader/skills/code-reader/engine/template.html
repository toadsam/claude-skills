  return '<div class="th-cur rd-cur"><button type="button" class="th-back" id="rdBack">← 흐름 ' + FLOWS.length + "개 모두 보기</button>" +
    '<div class="th-cur-b rd-cur-b"><span class="rd-cur-ic">' + (FL_ICON[fl.id] || "📁") + "</span><b>" + esc(fl.name || "") + '</b><span class="th-bar"><i style="width:' + (t ? Math.round(r / t * 100) : 0) + '%"></i></span><small>읽은 덩어리 ' + r + " / " + t + " · 파일 " + flowFiles(state.flow).length + "개</small></div></div>";
}
function renderReadHub() {
  let R = 0, T = 0; FLOWS.forEach((fl) => { const [a, b] = flowProgress(fl.id); R += a; T += b; });
  const cur = FILES.find((x) => x.file === state.file);
  const done = FILES.filter((f) => { const [a, b] = fileProgress(f); return b && a === b; }).length;
  const tile = (ic, v, label) => '<div class="px-tile"><span class="px-tile-ic">' + ic + "</span><b>" + v + "</b><span>" + label + "</span></div>";
  let h = '<div class="px-hero rd-hero"><div class="px-hero-main rd-main"><span class="px-kicker">코드 읽기</span><h2>실제 코드를 한 줄씩, 한국어로</h2><p>저장소 파일 그대로예요. 줄을 누르면 그 줄의 뜻, 밑줄 단어를 누르면 사전이 나와요. 흐름을 고르면 추천 순서대로 파일이 놓여 있어요.</p>' +
    (cur ? '<div class="px-hero-btns"><button type="button" class="px-start" id="rdResume">▶ 이어 읽기</button><span class="px-scope-now"><b>' + esc(cur.base) + "</b> · " + (ixFirstUnread(cur) + 1) + "번 덩어리부터</span></div>" : "") + "</div>" +
    '<div class="px-stats"><div class="px-tile"><svg class="px-acc" viewBox="-30 -30 60 60"><g transform="rotate(-90)">' + ixRing(T ? R / T : 0, 24, "i") + '</g></svg><b>' + (T ? Math.round(R / T * 100) : 0) + '%</b><span>읽은 덩어리 ' + R + " / " + T + "</span></div>" +
    tile("📄", FILES.length, "파일 조각") + tile("✅", done, "다 읽은 조각") + tile("🧾", FILES.reduce((a, f) => a + f.lines.length, 0).toLocaleString(), "코드 줄") + tile("⭐", stars.size, "별표 친 줄") + "</div></div>";
  if (CHANGES && (CHANGES.blocks || []).length) {
    const items = CHANGES.blocks.map((x) => { const f = FILES.find((y) => y.file === x.file); const bi = f ? f.blocks.findIndex((b) => b.fp === x.fp) : -1; return { x, f, bi }; }).filter((o) => o.f && o.bi >= 0);
    h += '<h3 class="px-h">🆕 지난번 이후 바뀐 곳 <small>' + esc(CHANGES.sinceLabel || "") + " → " + esc(CHANGES.atLabel || "") + " · 덩어리 " + items.length + "개 · 바뀐 덩어리는 다시 '안 읽음'이 돼요</small></h3><div class=\"rd-changes\">" +
      items.map((o) => '<button type="button" class="rd-chg' + (readSet.has(rk(o.f, o.bi)) ? " read" : "") + '" data-chf="' + esc(o.f.file) + '" data-chb="' + o.bi + '"><span class="rd-chg-k k-' + esc(o.x.status) + '">' + ({ changed: "바뀜", new: "새로" }[o.x.status] || "바뀜") + "</span><b>" + esc(o.f.blocks[o.bi].title) + '</b><small>' + esc(o.f.base) + " · " + o.f.blocks[o.bi].start + "~" + o.f.blocks[o.bi].end + "줄</small></button>").join("") + "</div>";
    if ((CHANGES.files || []).length) h += '<p class="muted-s rd-chg-files">파일: ' + CHANGES.files.map((x) => esc(x.status) + " " + esc(x.path)).join(" · ") + "</p>";
  }
  for (const [title, ids] of FL_SECTIONS) {
    const fls = ids.map((id) => FLOWS.find((x) => x.id === id)).filter(Boolean);
    if (!fls.length) continue;
    h += '<h3 class="px-h">' + esc(title) + '</h3><div class="rd-grid">' + fls.map((fl) => {
      const [r, t] = flowProgress(fl.id), list = flowFiles(fl.id), p = t ? r / t : 0;
      const tiles = list.map((f, i) => { const [a, b] = fileProgress(f); return '<button type="button" class="rd-file" data-rdf="' + esc(f.file) + '" style="--p:' + (b ? a / b : 0) + '"' + tipAttr("<b>" + String(i + 1).padStart(2, "0") + ". " + esc(f.base) + "</b><br>" + esc(f.path || f.file) + "<br>읽은 덩어리 " + a + " / " + b) + "></button>"; }).join("");
      return '<article class="rd-card' + (fl.id === state.flow ? " last" : "") + (t && r === t ? " fin" : "") + '"><div class="th-top"><span class="rd-ic">' + (FL_ICON[fl.id] || "📁") + '</span><svg class="th-ring" viewBox="-22 -22 44 44"><g transform="rotate(-90)">' + ixRing(p, 17, "i") + '</g><text y="4" text-anchor="middle">' + (t && r === t ? "✓" : Math.round(p * 100) + "%") + "</text></svg></div>" +
        "<h3>" + esc(fl.name) + '</h3><p class="muted-s">파일 ' + list.length + "개 · " + flowLines(fl.id).toLocaleString() + "줄 · 덩어리 " + t + '개</p><div class="rd-files">' + tiles + '</div><div class="th-btns"><button type="button" class="btn primary" data-rdo="' + fl.id + '">' + (r && r < t ? "▶ 이어 읽기" : r === t && t ? "↻ 다시 보기" : "▶ 읽기 시작") + "</button>" +
        (TOURS.some((x) => x.flow === fl.id) ? '<button type="button" class="btn" data-rdt="' + fl.id + '">🧭 따라가기</button>' : "") + "</div></article>";
    }).join("") + "</div>";
  }
  h += '<p class="muted-s rd-foot">작은 칸 하나가 파일 하나예요. 색이 찰수록 많이 읽은 파일이고, 누르면 그 파일을 바로 열어요.</p>';
  const H = $("#readHub");
  H.innerHTML = h;
  const res = $("#rdResume"); if (res && res.addEventListener) res.addEventListener("click", () => { ixLeaveReadHub(); openFile(cur.file, ixFirstUnread(cur)); });
  H.querySelectorAll("[data-rdo]").forEach((b) => b.addEventListener("click", () => ixOpenFlow(b.dataset.rdo)));
  H.querySelectorAll("[data-rdt]").forEach((b) => b.addEventListener("click", () => ixGoFlow(b.dataset.rdt)));
  H.querySelectorAll("[data-chf]").forEach((b) => b.addEventListener("click", () => { ixLeaveReadHub(); openFile(b.dataset.chf, +b.dataset.chb); }));
  H.querySelectorAll("[data-rdf]").forEach((b) => b.addEventListener("click", () => { const f = FILES.find((x) => x.file === b.dataset.rdf); ixLeaveReadHub(); openFile(f.file, ixFirstUnread(f)); }));
}
/* 덩어리 지도: 파일 위 가로 띠. 칸 길이 = 덩어리 줄 수 */
const CHANGES = DATA.changes || null;
const CHANGED_FP = new Set(((CHANGES && CHANGES.blocks) || []).map((x) => x.file + "#" + x.fp));
// 지난 판에서 바로 올라온 경우: 별표 · 틀린 줄의 줄 번호를 새 줄로 옮긴다
(function () {
  const B = DATA.build || {}, seen = store.get("buildId", null);
  if (B.id && seen && seen !== B.id && CHANGES && CHANGES.prevBuild === seen && CHANGES.lineRuns) {
    const mapLine = (p, l) => { const runs = CHANGES.lineRuns[p]; if (!runs) return l; for (const [o, n, len] of runs) if (l >= o && l < o + len) return n + (l - o); return null; };
    const remap = (set) => { const out = new Set(); let lost = 0; for (const k of set) { const i = k.lastIndexOf("|"), p = k.slice(0, i), l = mapLine(p, +k.slice(i + 1)); if (l === null) lost++; else out.add(p + "|" + l); } return [out, lost]; };
    const [s2, lost] = remap(stars); stars = s2; store.set("stars", [...stars]);
    const [m2] = remap(missedLines); missedLines = m2; store.set("missedLines", [...missedLines]);
    if (lost) setTimeout(() => ixToast("⭐ 바뀐 줄에 있던 별표 " + lost + "개는 뺐어요", "no"), 800);
  }
  if (B.id) store.set("buildId", B.id);
})();
function blockMapHtml(f) {
  return '<div class="bmap" id="bmap" aria-label="덩어리 지도">' + f.blocks.map((b, i) => '<button type="button" class="bm-seg k-' + (b.kind || "other") + (readSet.has(rk(f, i)) ? " read" : "") + '" data-bm="' + i + '" style="flex-grow:' + Math.max(1, b.end - b.start + 1) + '"' + tipAttr("<b>" + (i + 1) + ". " + esc(b.title) + "</b><br>" + b.start + "~" + b.end + "줄 · " + (readSet.has(rk(f, i)) ? "읽음" : "아직") + (Object.values(b.lines || {}).some(isWarn) ? " · ⚠ 주의 있음" : "")) + ">" + (Object.values(b.lines || {}).some(isWarn) ? "<i></i>" : "") + (CHANGED_FP.has(f.file + "#" + b.fp) ? '<em class="bm-new" title="지난번 이후 바뀜"></em>' : "") + "</button>").join("") + "</div>";
}
function ixBmapUpdate(f, bi) {
  const m = $("#bmap"); if (!m || !m.querySelectorAll) return;
  m.querySelectorAll("[data-bm]").forEach((s) => { const i = +s.dataset.bm; s.classList.toggle("cur", i === bi); s.classList.toggle("read", readSet.has(rk(f, i))); });
  const [r, t] = fileProgress(f), fp = $("#fileProg"); if (fp) fp.innerHTML = "<b>" + r + " / " + t + "</b> 덩어리 읽음";
}
function ixBindBmap(f) {
  const m = $("#bmap"); if (!m || !m.querySelectorAll) return;
  m.querySelectorAll("[data-bm]").forEach((s) => s.addEventListener("click", () => selectBlock(+s.dataset.bm, null, true)));
}
function ixOnRead(f) {
  const [r, t] = fileProgress(f);
  if (t && r === t) {
    const [a, b] = flowProgress(f.flow);
    if (a === b) ixToast("🏆 <b>" + esc(flowName(f.flow)) + "</b> 흐름을 다 읽었어요!", "ok");
    else ixToast("📗 <b>" + esc(f.base) + "</b> 다 읽었어요", "ok");
  }
}
function showTab(name) {
  for (const [id, v] of [["Read", "read"], ["Tour", "tour"], ["Gloss", "gloss"], ["Practice", "practice"], ["Map", "map"], ["Review", "review"]]) {
    $("#tab" + id).setAttribute("aria-selected", name === v);
    $("#" + v + "View").hidden = name !== v;
  }
  const hub = name === "tour" && tHub, rhub = name === "read" && rHub;
  $("#tourHubView").hidden = !hub;
  if (hub) $("#tourView").hidden = true;
  $("#readHubView").hidden = !rhub;
  if (rhub) $("#readView").hidden = true;
  if (name !== "tour") tAutoStop();
  if (name !== "map" && typeof mxStop === "function") mxStop();
  $("#mobileFiles").hidden = name !== "read" || rhub;
  store.set("tab", name);
  if (name === "gloss") renderGloss();
  if (name === "practice") renderPractice();
  if (name === "review") renderReview();
  if (name === "map") renderMap();
  if (name === "tour") { if (hub) renderTourHub(); else openTour(tourState.id, tourState.step); }
  else if (name === "read") { if (rhub) renderReadHub(); else renderSide(); }
}
if (typeof document !== "undefined" && document.addEventListener) document.addEventListener("click", (e) => {
  const t = e.target && e.target.closest ? e.target : null; if (!t) return;
  if (t.closest("#rdBack")) { rHub = true; store.set("rHub", true); showTab("read"); }
});

/* ---------- 시작 ---------- */
if (store.get("noterms", false)) document.body.classList.add("noterms");
updateProgress();
openFile(state.file, null, null);
ixBooting = false;
showTab(["#gloss", "#tour", "#practice", "#review", "#map"].includes(location.hash) ? location.hash.slice(1) : (["read", "tour", "gloss", "practice", "review", "map"].includes(store.get("tab", "read")) ? store.get("tab", "read") : "read"));
</script>
