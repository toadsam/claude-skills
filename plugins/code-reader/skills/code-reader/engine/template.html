<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 에디터처럼 왼쪽 파일 목록 · 가운데 실제 코드 전체 · 오른쪽 해설. 줄을 누르면 해설, 밑줄 단어를 누르면 사전 */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #e9edf2;
  --ink: #1a2230;
  --ink-2: #536072;
  --line: #d6dce5;
  --accent: #2b5bd7;
  --accent-soft: #e4ebfb;
  --sel: #fff1b8;
  --sel-block: #f6f8fc;
  --band-a: #9fb5e8;
  --band-b: #c9d3e6;
  --ok: #1b7d52; --ok-soft: #e1f2e9;
  --warn: #b5402f; --warn-soft: #fbe7e3;
  --code-bg: #fbfcfd;
  --kw: #8a3fb8; --str: #9a5b00; --com: #6d7a88; --ann: #1d7a8a; --num: #b13b5a; --type: #2b5bd7;
  --term: #2b5bd7;
  --cmt: #2c7a55;
  --lane1: #7446c9; --lane2: #2b5bd7; --lane3: #b06a00; --lane4: #187a50; --lane5: #b13b5a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171d26; --surface-2: #212a36; --ink: #e5eaf1; --ink-2: #a0acbc; --line: #2c3644;
    --accent: #85a6ff; --accent-soft: #1e2b47; --sel: #3a3415; --sel-block: #1b2230; --band-a: #4a63a3; --band-b: #2f3c55;
    --ok: #5ccb97; --ok-soft: #16362a; --warn: #ff8f80; --warn-soft: #3c201d; --code-bg: #121820;
    --kw: #d39bff; --str: #e3b66b; --com: #7f8b99; --ann: #6fd0dc; --num: #ff8fae; --type: #85a6ff; --term: #9db8ff; --cmt: #7fcfa3;
    --lane1: #b597f2; --lane2: #85a6ff; --lane3: #e8a94a; --lane4: #5cc795; --lane5: #ff8fae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171d26; --surface-2: #212a36; --ink: #e5eaf1; --ink-2: #a0acbc; --line: #2c3644;
  --accent: #85a6ff; --accent-soft: #1e2b47; --sel: #3a3415; --sel-block: #1b2230; --band-a: #4a63a3; --band-b: #2f3c55;
  --ok: #5ccb97; --ok-soft: #16362a; --warn: #ff8f80; --warn-soft: #3c201d; --code-bg: #121820;
  --kw: #d39bff; --str: #e3b66b; --com: #7f8b99; --ann: #6fd0dc; --num: #ff8fae; --type: #85a6ff; --term: #9db8ff; --cmt: #7fcfa3;
  --lane1: #b597f2; --lane2: #85a6ff; --lane3: #e8a94a; --lane4: #5cc795; --lane5: #ff8fae;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.65; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: var(--ink); }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; overflow: hidden; }
.stage { display: flex; flex-direction: column; min-height: 0; }
.stage > .workspace { flex: 1 1 auto; }
.workspace > * { min-height: 0; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.topbar .sub { color: var(--ink-2); font-size: 0.82rem; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; font-size: 0.86rem; font-weight: 500; color: var(--ink-2); }
.tabs button:first-child { border-radius: 6px 0 0 6px; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.prog { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-2); }
.prog .bar { width: 120px; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

.workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr) 400px; min-height: 0; height: 100%; }
.side { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 12px 8px 24px; }
.flows { display: grid; gap: 4px; margin: 0 4px 14px; }
.flows button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 0.88rem; display: flex; justify-content: space-between; gap: 8px; }
.flows button span { font-weight: 400; font-size: 0.74rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.flows button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.flows button[aria-pressed="true"] span { color: var(--surface); opacity: .8; }
.side .group { font-size: 0.72rem; font-weight: 700; color: var(--ink-2); letter-spacing: 0.06em; margin: 14px 8px 4px; }
.side .group:first-child { margin-top: 0; }
.fbtn { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 6px; font-size: 0.86rem; }
.fbtn:hover { background: var(--surface-2); }
.fbtn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.fbtn .n { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-2); }
.fbtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbtn .pc { font-size: 0.7rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fbtn.full .pc { color: var(--ok); font-weight: 700; }
.side .hint { margin: 18px 8px 0; font-size: 0.78rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

.center { overflow-y: auto; min-width: 0; padding: 16px 20px 80px; }
.fhead { display: grid; gap: 8px; margin-bottom: 14px; }
.fhead .path { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-2); word-break: break-all; }
.fhead h2 { font-size: 1.25rem; }
.fhead .one { font-size: 1.02rem; font-weight: 500; }
.fhead .role { color: var(--ink-2); max-width: 75ch; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; }
.rel .lab { color: var(--ink-2); min-width: 92px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 1px 10px; font-size: 0.8rem; }
.chip.link { color: var(--accent); border-color: var(--accent); }
.chip.link:hover { background: var(--accent-soft); }
.blocks-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.blocks-nav button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 0.78rem; color: var(--ink-2); }
.blocks-nav button.read { border-color: var(--ok); color: var(--ok); }
.blocks-nav button[aria-current="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.7; padding: 6px 0; }
.row { display: grid; grid-template-columns: 5px 46px max-content; cursor: pointer; min-width: max-content; }
.row .band { background: transparent; }
.row.ba .band { background: var(--band-a); }
.row.bb .band { background: var(--band-b); }
.row .no { text-align: right; padding-right: 14px; color: var(--ink-2); opacity: .65; user-select: none; }
.row .tx { white-space: pre; padding-right: 20px; }
.row:hover { background: var(--surface-2); }
.row.inblock { background: var(--sel-block); }
.row.inblock .band { background: var(--accent); }
.row.cur { background: var(--sel); }
.row.has-note .no { opacity: 1; }
.tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-com { color: var(--com); font-style: italic; } .tk-ann { color: var(--ann); } .tk-num { color: var(--num); } .tk-type { color: var(--type); }
.term { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--term); cursor: help; }
.term:hover { background: var(--accent-soft); }
body.noterms .term { text-decoration: none; }

.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 18px 0; display: grid; align-content: start; gap: 14px; }
.panel .empty { color: var(--ink-2); }
.kind { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 4px; padding: 0 7px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0.03em; }
.panel h3 { font-size: 1.08rem; }
.range { font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-2); }
.sig { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; }
.sig b { color: var(--ink-2); font-size: 0.78rem; font-weight: 700; }
.lbl { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-2); margin-bottom: 4px; }
.thisline { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 10px 12px; display: grid; gap: 6px; }
.thisline pre, .note pre { margin: 0; font-family: var(--font-mono); font-size: 0.76rem; white-space: pre-wrap; word-break: break-all; color: var(--ink-2); }
.notes { display: grid; gap: 2px; }
.note { display: grid; gap: 2px; text-align: left; border: 0; background: none; border-radius: 6px; padding: 6px 8px; }
.note:hover { background: var(--surface-2); }
.note.cur { background: var(--sel); }
.note .ln { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-2); }
.warnnote { color: var(--warn); }
.tref { color: var(--term); text-decoration: underline dotted; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-weight: 500; }
.navbtns { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 12px 0 14px; position: sticky; bottom: 0; background: var(--surface); z-index: 2; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 0.84rem; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.sheet-close { display: none; }

/* glossary */
.gloss { overflow-y: auto; padding: 18px 20px 80px; grid-column: 1 / -1; }
.gloss-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.gloss-top input { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--surface); min-width: 0; width: 260px; max-width: 100%; }
.gfilter { display: flex; flex-wrap: wrap; gap: 4px; }
.gfilter button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 0.78rem; }
.gfilter button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.gcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.gcard:hover { border-color: var(--accent); }
.gcard .gn { font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem; }
.gcard .gg { font-size: 0.72rem; color: var(--ink-2); }
.gcard .gw { font-size: 0.84rem; color: var(--ink-2); }

/* term modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border-radius: 12px; width: min(640px, 100%); max-height: 86vh; overflow-y: auto; padding: 20px 22px; display: grid; gap: 12px; border: 1px solid var(--line); }
.modal .mh { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.modal h3 { font-family: var(--font-mono); font-size: 1.15rem; }
.modal pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 0.78rem; overflow-x: auto; white-space: pre; }
.occ { display: flex; flex-wrap: wrap; gap: 4px; }
.occ button { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 1px 6px; }
.occ button:hover { border-color: var(--accent); color: var(--accent); }

.mobile-files { display: none; }
.tourws { grid-template-columns: 360px minmax(0, 1fr) 400px; }
.tourside { padding: 14px 12px 24px; }
.tour-pick { display: grid; gap: 6px; margin-bottom: 12px; }
.tour-pick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.tour-pick button b { font-size: 0.9rem; }
.tour-pick button span { font-size: 0.76rem; color: var(--ink-2); }
.tour-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 6px; }
.tl-lanes { display: flex; gap: 0; font-size: 0.66rem; font-weight: 700; }
.tl-lanes span { width: 34px; text-align: center; overflow: hidden; white-space: nowrap; }
.tl { position: relative; }
.tl svg.tl-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.tl-row { position: relative; display: block; width: 100%; height: 58px; border: 0; background: none; text-align: left; padding: 6px 6px 6px var(--tl-pad); border-radius: 8px; }
.tl-row:hover { background: var(--surface-2); }
.tl-row[aria-current="true"] { background: var(--accent-soft); }
.tl-row .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.8rem; line-height: 1.35; font-weight: 500; }
.tl-row .tc { display: block; font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.tl-row.seen .tt { color: var(--ink-2); }
.tl-row[aria-current="true"] .tt { color: var(--ink); font-weight: 700; }
.lane-chip { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 0 8px; color: var(--surface); }
.step-count { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-2); }
.carry { border: 1.5px dashed var(--accent); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--accent-soft); }
.carry .arrowline { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.nextprev { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 0.84rem; }
.nextprev:hover { border-color: var(--accent); }
.nextprev .mono { color: var(--ink-2); font-size: 0.72rem; }
.ext-card { margin: 8vh auto 0; max-width: 520px; border: 2px dashed var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 12px; text-align: center; background: var(--surface); }
.ext-card .big { font-size: 1.6rem; font-weight: 700; }
.tour-file { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tour-file .path { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); word-break: break-all; }
.tour-hint { margin-top: 14px; font-size: 0.78rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.tourlink { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 0.78rem; font-weight: 500; }
.tourlink:hover { background: var(--accent-soft); }
.big-modal { width: min(1100px, 100%); }
.seq-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); max-height: 70vh; }
.seq-wrap svg { display: block; }
.seq-box { width: 100%; height: 100%; box-sizing: border-box; border-radius: 8px; border: 1.5px solid var(--c); background: var(--surface); padding: 4px 8px; font-size: 12px; line-height: 1.3; color: var(--ink); cursor: pointer; overflow: hidden; display: flex; gap: 6px; align-items: center; font-family: var(--font-body); }
.seq-box b { color: var(--c); font-family: var(--font-mono); }
.seq-box.cur { background: var(--sel); border-width: 2.5px; }
.seq-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); background: var(--code-bg); padding: 0 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

/* ---- 읽기 쉬운 해설 칸 ---- */
.panel { gap: 16px; font-size: 0.92rem; line-height: 1.6; }
.panel h3 { font-size: 1.15rem; letter-spacing: -0.01em; }
.saylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.saylist li { position: relative; padding-left: 18px; }
.saylist li::before { content: ""; position: absolute; left: 4px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.saylist li.first { font-weight: 600; font-size: 1em; }
.saylist li.warn { color: var(--warn); }
.saylist li.warn::before { background: var(--warn); }
.say1 { margin: 0; }
.warn-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--surface); background: var(--warn); border-radius: 4px; padding: 0 6px; vertical-align: 1px; }
.tref { cursor: pointer; display: inline; font: inherit; font-weight: 600; }
.tref:hover, .tref:focus-visible { background: var(--accent-soft); border-radius: 3px; }
.thisline { gap: 8px; padding: 12px 14px; }
.tl-code { font-family: var(--font-mono); font-size: 0.8rem; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
.tl-say { font-size: 0.95rem; font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 8px 6px 8px 0; border-radius: 8px; position: relative; }
.step.click { cursor: pointer; }
.step.click:hover { background: var(--surface-2); }
.step.cur { background: var(--sel); }
.step-no { position: relative; z-index: 1; width: 32px; height: 22px; border-radius: 11px; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; display: grid; place-items: center; margin-top: 2px; }
.step.warn .step-no { border-color: var(--warn); color: var(--warn); }
.step-body { display: grid; gap: 4px; min-width: 0; }
.step-code { font-family: var(--font-mono); font-size: 0.74rem; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.cur .step-code { white-space: pre-wrap; word-break: break-word; }
.step-say { font-size: 0.9rem; }
.step.warn .step-say { color: var(--warn); }
.linenotes .steps { margin-top: 8px; }
.step-say .tref, .tl-say .tref, .saylist .tref { font-size: 0.8em; font-weight: 600; text-decoration: none; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
/* ---- 프로젝트 지도 ---- */
.dp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.dp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.dp-card h3 { font-size: 1.02rem; }
.dp-steps { margin: 0; padding: 0; list-style: none; counter-reset: dp; display: grid; gap: 0; }
.dp-steps li { counter-increment: dp; position: relative; padding: 6px 0 6px 34px; font-size: 0.9rem; }
.dp-steps li::before { content: counter(dp); position: absolute; left: 0; top: 5px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--surface); font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; }
.dp-steps li:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 30px; bottom: -6px; width: 2px; background: var(--accent-soft); }
.dp-result { background: var(--ok-soft); border-radius: 6px; padding: 6px 8px; font-size: 0.88rem; }
.env-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.env-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; font-size: 0.9rem; }
.env-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.env-name { font-weight: 700; font-size: 0.86rem; color: var(--accent); word-break: break-all; }
.env-miss { background: var(--warn-soft); border-radius: 6px; padding: 5px 8px; font-size: 0.84rem; }
.dt-node { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
.dt-node > summary { cursor: pointer; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; list-style: none; }
.dt-node > summary::-webkit-details-marker { display: none; }
.dt-node[open] > summary { border-bottom: 1px solid var(--line); }
.dt-icon { color: var(--accent); font-weight: 700; }
.dt-path { font-weight: 700; font-size: 0.9rem; }
.dt-body { padding: 10px 12px; display: grid; gap: 8px; }
.dt-body .dt-node { margin-left: 8px; }
.fld { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.fld th, .fld td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.fld th { color: var(--ink-2); font-size: 0.74rem; white-space: nowrap; }
.fld td:first-child code { font-weight: 700; color: var(--accent); }
.tline { list-style: none; margin: 14px 0 0; padding: 0 0 0 18px; position: relative; display: grid; gap: 14px; }
.tline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl-phase { position: relative; }
.tl-dot { position: absolute; left: -17px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.tl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.tl-when { font-size: 0.78rem; color: var(--ink-2); font-family: var(--font-mono); }
.tl-card h3 { font-size: 1rem; }
.tl-items { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 8px; font-size: 0.86rem; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.sw { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 0.84rem; }
.sw-c { grid-row: span 4; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); }
.shot-wrap { display: grid; grid-template-columns: minmax(220px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.shot { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 50px; }
.shot img { display: block; width: 100%; height: auto; }
.mk { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: var(--accent); color: #fff; font-size: 0.74rem; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.35); padding: 0; }
.mk.on { background: var(--warn); transform: translate(-50%, -50%) scale(1.25); }
.mk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mk-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 0.88rem; }
.mk-list li.on { border-color: var(--warn); background: var(--warn-soft); }
.mk-n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; }
@media (max-width: 720px) { .shot-wrap { grid-template-columns: minmax(0, 1fr); } .shot { position: relative; top: 0; max-width: 340px; } }
/* ---- 연습하기 · 프로젝트 평가 ---- */
.tabs { flex-wrap: wrap; }
.pview { max-width: 1100px; width: 100%; margin: 0 auto; }
.p-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.pmodes { display: flex; flex-wrap: wrap; gap: 4px; }
.pmodes button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 0.84rem; color: var(--ink-2); }
.pmodes button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.p-scope select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); color: var(--ink); font: inherit; }
.p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.p-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.p-stat { margin-left: auto; font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.p-q { font-size: 1rem; font-weight: 500; }
.p-code { max-height: 46vh; overflow: auto; }
.p-code .row { cursor: default; }
#pAns { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); color: var(--ink); font: inherit; resize: vertical; }
.p-grade { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.ok { border-color: var(--ok); color: var(--ok); } .btn.no { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.p-answer { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
.p-answer h3 { font-size: 1.02rem; margin-bottom: 4px; }
.p-compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.p-compare > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kw-chip { display: inline-block; margin: 0 4px 4px 0; padding: 0 8px; border-radius: 99px; font-size: 0.78rem; border: 1px dashed var(--line); color: var(--ink-2); }
.kw-chip.hit { border-style: solid; border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.muted-s { font-size: 0.8rem; color: var(--ink-2); }
.linkish { border: 0; background: none; color: var(--accent); padding: 0; font-size: 0.84rem; text-align: left; justify-self: start; }
.p-only { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 0.84rem; color: var(--ink-2); }
.ord-cards { display: grid; gap: 8px; }
.ord-card { display: grid; grid-template-columns: 32px minmax(0, 1fr); grid-template-areas: "n t" "n w"; gap: 2px 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.ord-card .ord-n { grid-area: n; align-self: center; width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 700; }
.ord-card.on .ord-n { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--surface); }
.ord-card .ord-t { grid-area: t; font-weight: 500; } .ord-card .ord-w { grid-area: w; }
.ord-card.right { border-color: var(--ok); background: var(--ok-soft); } .ord-card.wrong { border-color: var(--warn); background: var(--warn-soft); }
.ord-right { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.ord-carry { font-size: 0.78rem; color: var(--ink-2); margin-left: 6px; }
.flash-name { font-size: 1.4rem; }
.flash-ex { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); font-size: 0.78rem; overflow-x: auto; white-space: pre; margin-top: 8px; }
.p-groups { margin-bottom: 10px; }
.star-list { display: grid; gap: 10px; }
.star-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.star-code { margin: 0; font-family: var(--font-mono); font-size: 0.78rem; background: var(--code-bg); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: pre; }
.row.starred .no { color: #c98a00; opacity: 1; font-weight: 700; }
.row.starred .no::before { content: "★"; margin-right: 2px; }
.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.starbtn { padding: 2px 10px; font-size: 0.78rem; }
.starbtn[aria-pressed="true"] { border-color: #c98a00; color: #c98a00; }
.prog-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.prog-sum > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; }
.prog-sum b { font-size: 1.5rem; font-variant-numeric: tabular-nums; } .prog-sum span { font-size: 0.8rem; color: var(--ink-2); }
.tablewrap { overflow-x: auto; }
.prog-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 0.86rem; }
.prog-table th, .prog-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.pbar { display: inline-block; width: 90px; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.pbar i { display: block; height: 100%; background: var(--ok); } .pbar.tour i { background: var(--accent); } .pbar.quiz i { background: var(--lane1); }
.pnum { font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--ink-2); }
.rv-summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; margin-bottom: 12px; }
.rv-summary h2 { font-size: 1.15rem; }
.rv-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; position: sticky; top: -18px; background: var(--bg); padding: 8px 0; z-index: 2; }
.rv-nav a { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px; font-size: 0.84rem; color: var(--ink); text-decoration: none; }
.rv-sec { margin-top: 18px; display: grid; gap: 10px; }
.rv-sec > h2 { font-size: 1.1rem; padding-left: 10px; border-left: 4px solid var(--accent); }
.rv-good > h2 { border-color: var(--ok); } .rv-weak > h2 { border-color: var(--warn); } .rv-key > h2 { border-color: var(--lane1); }
.rv-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.rv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.rv-card h3 { font-size: 1rem; }
.rv-card ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.rv-tags, .rv-ev { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rv-fix { font-size: 0.88rem; background: var(--ok-soft); border-radius: 6px; padding: 6px 8px; }
.sev { font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 0 8px; color: var(--surface); }
.sev-hi { background: var(--warn); } .sev-mid { background: #b06a00; } .sev-lo { background: var(--ink-2); }
.warn-list { display: grid; gap: 6px; }
.warn-item { cursor: pointer; display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
.warn-item:hover { background: var(--warn-soft); }
.wi-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wi-t { font-size: 0.88rem; }
@media (max-width: 720px) { .p-compare { grid-template-columns: minmax(0, 1fr); } .rv-cards { grid-template-columns: minmax(0, 1fr); } .tabs { margin-left: 0; } }
/* ---- 한국어 주석 줄 ---- */
.row.cmt .tx { color: var(--cmt); font-family: var(--font-body); font-size: 0.8rem; white-space: pre-wrap; max-width: 92ch; line-height: 1.55; padding-block: 1px 5px; }
.row.cmt.warn .tx { color: var(--warn); font-weight: 500; }
.row.cmt.banner .tx { color: var(--accent); font-weight: 700; padding-top: 8px; }
.row.cmt { cursor: pointer; }
.code-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
.notetoggle[aria-pressed="true"] { border-color: var(--cmt); color: var(--cmt); }
/* ---- 그림 위주 따라가기 ---- */
.story-pick { display: grid; gap: 4px; margin-bottom: 10px; }
.story-pick button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 0.86rem; }
.story-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.story-pick .sp-icons { display: flex; gap: 2px; }
.story-pick small { color: var(--ink-2); font-size: 0.72rem; }
.seg { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 8px; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.seg .seg-big { font-weight: 700; color: var(--accent); }
.tl-lanes { display: flex; align-items: center; gap: 0; margin-bottom: 4px; }
.tl-lanes span { width: 30px; display: flex; justify-content: center; }
.tl-lanes em { font-style: normal; font-size: 0.68rem; color: var(--ink-2); margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row { height: 66px; padding: 4px 6px 4px var(--tl-pad); display: grid; align-content: start; gap: 4px; }
.tl-row::before { content: ""; position: absolute; left: calc(var(--tl-pad) - 8px); width: 4px; background: var(--fc); top: 2px; bottom: 2px; border-radius: 3px; opacity: .85; }
.tl-row.g-start::before { bottom: -2px; border-radius: 3px 3px 0 0; }
.tl-row.g-mid::before { top: -2px; bottom: -2px; border-radius: 0; }
.tl-row.g-end::before { top: -2px; border-radius: 0 0 3px 3px; }
.tl-row .tt { font-size: 0.8rem; line-height: 1.32; -webkit-line-clamp: 2; }
.tl-row .tt b { font-family: var(--font-mono); color: var(--ink-2); font-size: 0.72rem; margin-right: 2px; }
.tl-row .tw { display: flex; min-width: 0; }
.tl-row .cont { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-2); }
.ftag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; border-radius: 6px; padding: 1px 7px 1px 3px; font-size: 0.74rem; font-weight: 600; background: color-mix(in srgb, var(--fc) 14%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent); white-space: nowrap; overflow: hidden; }
.ftag > span { overflow: hidden; text-overflow: ellipsis; }
.ftag small { font-family: var(--font-mono); font-weight: 400; color: var(--ink-2); font-size: 0.68rem; }
.ftag.ext { padding-left: 5px; }
.tbadge { flex: none; font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; border-radius: 4px; padding: 0 4px; line-height: 1.5; color: #fff; background: var(--fc, #555); }
.tbadge.t-java { background: #c4561b; } .tbadge.t-ts { background: #2f6fd1; } .tbadge.t-tsx { background: #1b8aa8; } .tbadge.t-py { background: #3d6e9e; } .tbadge.t-yml { background: #8a5a00; } .tbadge.t-gradle { background: #02303a; } .tbadge.t-Dockerfile { background: #1d63ed; } .tbadge.t-md { background: #4b5563; } .tbadge.t-json { background: #8a6d00; } .tbadge.t-js { background: #a68a00; } .tbadge.t-gitignore, .tbadge.t-dockerignore, .tbadge.t-gcloudignore { background: #6b7280; } .tbadge.t-properties { background: #02303a; } .tbadge.t-example, .tbadge.t-env_example { background: #7c3aed; }
.md-h { font-weight: 700; } .tbadge.t-html { background: #c0392b; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 0.78rem; }
.crumb { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-2); font-family: var(--font-mono); font-size: 0.74rem; }
.crumbs .sep { color: var(--ink-2); opacity: .6; }
.crumbs .ftag { font-size: 0.86rem; padding: 3px 9px 3px 4px; }
.tour-file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; border-left: 5px solid var(--fc); padding: 8px 12px; background: var(--surface); border-radius: 8px; margin-bottom: 10px; }
.tour-file #visitBox { grid-column: 1 / -1; }
.visits { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 0.74rem; color: var(--ink-2); }
.vdot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 0.68rem; padding: 0; }
.vdot.past { background: var(--surface-2); }
.vdot.now { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.visits span { margin-left: 4px; }
.fm-help { font-size: 0.78rem; color: var(--ink-2); margin-bottom: 8px; }
.fm { position: relative; display: grid; gap: 10px; }
.fm-route { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; overflow: visible; }
.fm-root { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface); display: grid; gap: 6px; }
.fm-root-h { display: flex; align-items: center; gap: 6px; font-size: 0.86rem; }
.fm-root-h .mono { font-size: 0.66rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-folder { display: grid; gap: 4px; padding-left: 6px; border-left: 2px dotted var(--line); }
.fm-folder-h { display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-2); }
.fm-tiles { display: grid; gap: 4px; }
.fm-tile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; border-radius: 7px; padding: 4px 6px; border: 1px solid var(--line); border-left: 4px solid var(--line); background: var(--surface); opacity: .45; font-size: 0.8rem; }
.fm-tile.on { opacity: 1; border-left-color: var(--fc); background: color-mix(in srgb, var(--fc) 8%, var(--surface)); cursor: pointer; }
.fm-tile.on:hover { border-color: var(--fc); }
.fm-tile.now { box-shadow: 0 0 0 2.5px var(--accent); }
.fm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.fm-badges { display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; max-width: 120px; }
.sbadge { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--lc); background: var(--surface); color: var(--lc); font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; padding: 0; line-height: 1; }
.sbadge.seen { background: color-mix(in srgb, var(--lc) 18%, var(--surface)); }
.sbadge.now { background: var(--lc); color: var(--surface); transform: scale(1.18); }
.lane-strip { display: flex; gap: 4px; flex-wrap: wrap; }
.ls { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px 2px 6px; font-size: 0.74rem; border: 1px solid var(--line); color: var(--ink-2); opacity: .55; }
.ls em { font-style: normal; }
.ls.on { opacity: 1; border-color: var(--lc); background: color-mix(in srgb, var(--lc) 16%, var(--surface)); color: var(--ink); font-weight: 700; }
.ls.next { opacity: 1; border-style: dashed; border-color: var(--lc); }
.prog-dots { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.prog-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--lc); cursor: pointer; }
.prog-dots i.past { background: var(--lc); opacity: .55; }
.prog-dots i.now { background: var(--lc); width: 14px; height: 14px; }
.prog-dots .step-count { margin-left: 6px; }
.step-title { font-size: 1.2rem; line-height: 1.35; }
.move { display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, 1.1fr) minmax(0, 1fr); align-items: center; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 12px 10px; }
.move .ftag { font-size: 0.78rem; padding: 4px 8px 4px 4px; }
.mv-from, .mv-to { display: flex; min-width: 0; }
.mv-to { justify-content: flex-end; }

.pill { max-width: 100%; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carry-text { font-size: 0.84rem; color: var(--ink-2); margin-top: -6px; }
.say p { font-size: 0.95rem; line-height: 1.7; }

.ext-card { border: 0; background: color-mix(in srgb, var(--fc) 10%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--fc) 45%, transparent); }
.ext-icon { display: flex; justify-content: center; }

.ext-title { font-size: 1.1rem; font-weight: 700; }
.ext-note { color: var(--ink-2); font-size: 0.84rem; }
.io { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: stretch; }

@media (max-width: 960px) { .move { grid-template-columns: minmax(0, 1fr); justify-items: start; } .mv-to { justify-content: flex-start; } .mv-arrow { width: 100%; } .io { grid-template-columns: minmax(0, 1fr); } .io-arrow { transform: rotate(90deg); justify-self: center; } }

@media (max-width: 1180px) {

}

  .mobile-files { display: block; padding: 10px 16px 0; }
  .mobile-files select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .center { padding: 12px 16px 120px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; border-left: 0; border-top: 2px solid var(--accent); border-radius: 14px 14px 0 0; z-index: 30; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
/* ======== 인터랙티브 탭 ======== */
:root {
  --gx: #16a34a; --gx-soft: #dcfce7; --bx: #2563eb; --bx-soft: #dbeafe; --ox: #ea7a12; --ox-soft: #ffedd5;
  --rx: #dc2626; --rx-soft: #fee2e2; --yx: #ca8a04; --yx-soft: #fef3c7; --px: #7c3aed; --px-soft: #ede9fe;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .06);
  --shadow-up: 0 2px 4px rgba(15, 23, 42, .08), 0 14px 30px rgba(15, 23, 42, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gx: #4ade80; --gx-soft: #12301f; --bx: #7aa2ff; --bx-soft: #1b2a4a; --ox: #fb9a3c; --ox-soft: #3a2614;
    --rx: #f87171; --rx-soft: #3b1a1a; --yx: #facc15; --yx-soft: #3a3010; --px: #b597ff; --px-soft: #2a2145;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); --shadow-up: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 30px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --gx: #4ade80; --gx-soft: #12301f; --bx: #7aa2ff; --bx-soft: #1b2a4a; --ox: #fb9a3c; --ox-soft: #3a2614;
  --rx: #f87171; --rx-soft: #3b1a1a; --yx: #facc15; --yx-soft: #3a3010; --px: #b597ff; --px-soft: #2a2145;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); --shadow-up: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 30px rgba(0, 0, 0, .4);
}
[hidden] { display: none !important; }
#practice, #pmap, #review { max-width: 1440px; }
.tabs #tabPractice[aria-selected="true"] { background: var(--gx); border-color: var(--gx); color: #fff; }
.tabs #tabMap[aria-selected="true"] { background: var(--bx); border-color: var(--bx); color: #fff; }
.tabs #tabReview[aria-selected="true"] { background: var(--ox); border-color: var(--ox); color: #fff; }
.tabs #tabPractice, .tabs #tabMap, .tabs #tabReview { transition: transform .15s, box-shadow .15s; }
.tabs #tabPractice:hover, .tabs #tabMap:hover, .tabs #tabReview:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

/* 말풍선 · 알림 */
.ix-tip { position: fixed; z-index: 9999; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--surface); font-size: .8rem; line-height: 1.5; padding: 7px 10px; border-radius: 8px; box-shadow: var(--shadow-up); }
.ix-toast { position: fixed; z-index: 9998; left: 50%; bottom: 28px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.ix-toast-item { background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 9px 18px; font-weight: 600; box-shadow: var(--shadow-up); animation: toastIn .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.ix-toast-item.ok { border-color: var(--gx); background: var(--gx-soft); }
.ix-toast-item.no { border-color: var(--ox); background: var(--ox-soft); }
.ix-toast-item.out { opacity: 0; transform: translateY(10px); transition: all .45s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.9); } }
.swap { animation: swapIn .28s ease-out; }
@keyframes swapIn { from { opacity: 0; transform: translateY(6px); } }
.rg-bg { fill: none; stroke: var(--surface-2); stroke-width: 6; }
.rg { fill: none; stroke-width: 6; stroke-linecap: round; animation: rgIn 1s cubic-bezier(.2, .8, .2, 1) both; }
.rg.g { stroke: var(--gx); } .rg.b { stroke: var(--bx); } .rg.o { stroke: var(--ox); }
@keyframes rgIn { from { stroke-dashoffset: var(--c); } }
.px-h { font-size: 1.05rem; margin: 28px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.px-h small { font-size: .78rem; font-weight: 400; color: var(--ink-2); }
.px-kicker { display: inline-block; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }

/* ================= 연습하기 ================= */
.px-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.px-hero-main { position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px; color: #fff; background: linear-gradient(135deg, #16a34a, #0d9488 60%, #0e7490); box-shadow: var(--shadow-up); }
.px-hero-main::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.px-hero-main h2 { font-size: 1.6rem; margin: 6px 0 8px; color: #fff; }
.px-hero-main p { opacity: .92; max-width: 46ch; }
.px-hero-btns { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; position: relative; z-index: 1; }
.px-start { border: 0; border-radius: 999px; padding: 12px 26px; font-size: 1.05rem; font-weight: 800; background: #fff; color: #0f766e; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); transition: transform .15s, box-shadow .15s; }
.px-start:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 24px rgba(0, 0, 0, .22); }
.px-scope-now { font-size: .86rem; opacity: .95; }
.px-scope-now .linkish { color: #fff; text-decoration: underline; }
.px-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.px-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; justify-items: center; align-content: center; gap: 2px; text-align: center; box-shadow: var(--shadow); transition: transform .15s; }
.px-tile:hover { transform: translateY(-2px); }
.px-tile-ic { font-size: 1.5rem; }
.px-tile b { font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.px-tile span:last-child { font-size: .78rem; color: var(--ink-2); }
.px-acc { width: 44px; height: 44px; }
.px-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.px-mode { position: relative; text-align: left; display: grid; gap: 4px; padding: 18px 18px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s, border-color .18s; overflow: hidden; color: var(--ink); }
.px-mode::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--mc, var(--gx)); }
.px-mode:hover { transform: translateY(-4px); box-shadow: var(--shadow-up); border-color: var(--mc, var(--gx)); }
.px-mode:hover .px-mode-ic { transform: scale(1.18) rotate(-6deg); }
.px-mode-ic { font-size: 2rem; transition: transform .2s; width: fit-content; }
.px-mode b { font-size: 1.05rem; }
.px-mode-d { font-size: .84rem; color: var(--ink-2); }
.px-mode-s { font-size: .78rem; font-weight: 600; color: var(--mc, var(--gx)); margin-top: 4px; }
.px-mini { height: 5px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.px-mini i { display: block; height: 100%; background: var(--mc, var(--gx)); border-radius: 9px; }
.m-line { --mc: #2563eb; } .m-block { --mc: #7c3aed; } .m-order { --mc: #db2777; } .m-card { --mc: #0891b2; } .m-stars { --mc: #ca8a04; } .m-progress { --mc: #16a34a; }
.px-rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.px-ring { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; color: var(--ink); }
.px-ring:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
.px-ring.sel { border: 2px solid var(--gx); background: var(--gx-soft); }
.px-ring svg { width: 70px; height: 70px; }
.px-ring .rg-bg, .px-ring .rg { stroke-width: 7; }
.px-ring-n { font-size: 13px; font-weight: 800; fill: var(--ink); }
.px-ring span { font-size: .78rem; font-weight: 600; text-align: center; line-height: 1.3; }
.px-cal { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 4px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: fit-content; }
.px-day { border-radius: 4px; background: var(--surface-2); }
.px-day.on { background: var(--gx); box-shadow: 0 0 0 1px var(--gx); }
.px-bar { position: sticky; top: -18px; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.px-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.px-title small { font-size: .74rem; font-weight: 700; color: #fff; background: var(--gx); border-radius: 999px; padding: 2px 8px; }
.px-title-ic { font-size: 1.4rem; }
.px-dots { display: flex; gap: 6px; }
.px-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); }
.px-dot.cur { border-color: var(--gx); animation: pulse 1.2s infinite; }
.px-dot.ok { background: var(--gx); border-color: var(--gx); } .px-dot.no { background: var(--ox); border-color: var(--ox); } .px-dot.skip { background: var(--line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--gx-soft); } }
.px-combo { margin-left: auto; font-weight: 800; color: var(--ink-2); opacity: .35; transition: opacity .2s; }
.px-combo.on { opacity: 1; color: var(--ox); }
.px-combo.pop { animation: comboPop .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes comboPop { 40% { transform: scale(1.35); } }
.px-body .p-card { border-radius: 16px; box-shadow: var(--shadow); }
.px-body .p-grade .btn.ok:hover, .px-body .p-grade .btn.no:hover, .px-body .btn.primary:hover { transform: translateY(-1px); }
.ord-list { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
.ord-item { display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: grab; transition: transform .15s, box-shadow .15s, border-color .15s, opacity .15s; }
.ord-item:hover { box-shadow: var(--shadow-up); border-color: #db2777; }
.ord-item.dragging { opacity: .4; transform: scale(.98); }
.ord-item.drop-b { box-shadow: inset 0 3px 0 #db2777; }
.ord-item.drop-a { box-shadow: inset 0 -3px 0 #db2777; }
.ord-grip { color: var(--ink-2); font-size: 1.1rem; }
.ord-item .ord-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #db2777; color: #fff; font-weight: 800; }
.ord-body { display: grid; gap: 4px; }
.ord-mv { display: flex; gap: 4px; }
.ord-mv .btn { padding: 2px 8px; }
.ord-list.done .ord-item { cursor: default; }
.ord-item.right { border-color: var(--gx); background: var(--gx-soft); }
.ord-item.right .ord-n { background: var(--gx); }
.ord-item.wrong { border-color: var(--ox); background: var(--ox-soft); animation: shake .4s; }
.ord-item.wrong .ord-n { background: var(--ox); }
.ord-mark { font-weight: 700; font-size: .84rem; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.px-done { position: relative; overflow: hidden; text-align: center; display: grid; justify-items: center; gap: 12px; padding: 40px 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-up); }
.px-done-score b { font-size: 4rem; font-weight: 900; color: var(--gx); animation: comboPop .6s; }
.px-done-score span { font-size: 1.4rem; color: var(--ink-2); }
.px-done-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.px-done-q { display: grid; justify-items: center; gap: 2px; padding: 10px 14px; border-radius: 12px; font-size: .8rem; font-weight: 700; border: 1px solid var(--line); }
.px-done-q span { font-size: 1.4rem; }
.px-done-q.ok { background: var(--gx-soft); border-color: var(--gx); } .px-done-q.no { background: var(--ox-soft); border-color: var(--ox); }
.px-done-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.px-done .px-start { background: var(--gx); color: #fff; }
.px-confetti { position: absolute; inset: 0; pointer-events: none; }
.px-confetti i { position: absolute; top: -12px; left: var(--x); width: 8px; height: 14px; border-radius: 2px; background: hsl(var(--h), 85%, 58%); animation: fall 1.8s var(--d) ease-in forwards; }
@keyframes fall { to { transform: translateY(520px) rotate(540deg); opacity: 0; } }

/* ================= 프로젝트 지도 ================= */
.mx-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.mx-tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink-2); cursor: pointer; transition: all .15s; }
.mx-tab:hover { color: var(--ink); border-color: var(--bx); transform: translateY(-1px); }
.mx-tab[aria-pressed="true"] { background: var(--bx); border-color: var(--bx); color: #fff; box-shadow: var(--shadow-up); }
.mx-tab-ic { font-size: 1.2rem; }
.mx-h { font-size: 1.35rem; margin-bottom: 4px; }
.mx-lead { margin-bottom: 14px; }
.mx-lead p { color: var(--ink-2); max-width: 90ch; }
.mx-notes { display: grid; gap: 8px; }
.mx-note { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ox); border-radius: 10px; }
.mx-note summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; list-style: none; }
.mx-note summary::-webkit-details-marker { display: none; }
.mx-note > div { padding: 0 14px 12px 48px; font-size: .9rem; }
.mx-note-n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ox-soft); color: var(--ox); font-size: .78rem; font-weight: 800; }
/* 전체 구조 */
.ax-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.ax-scens { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ax-scen { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; color: var(--ink); transition: all .15s; }
.ax-scen:hover { border-color: var(--bx); transform: translateY(-1px); box-shadow: var(--shadow); }
.ax-scen.on { background: var(--bx); color: #fff; border-color: var(--bx); }
.ax-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.ax-stage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; box-shadow: var(--shadow); position: relative; }
.ax { width: 100%; height: auto; display: block; }
.ax-band { fill: var(--px-soft); opacity: .55; }
.ax-band.b1 { fill: var(--bx-soft); opacity: .35; }
.ax-band-t { font-size: 13px; font-weight: 700; fill: var(--ink-2); }
.an { cursor: pointer; transition: opacity .2s; }
.an-r { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, filter .2s; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, .08)); }
.an-bar { fill: var(--gc); }
.an-ic { font-size: 20px; }
.an-t { font-size: 15px; font-weight: 800; fill: var(--ink); }
.an-s { font-size: 12px; fill: var(--ink-2); }
.an-s2 { font-size: 12px; fill: var(--ink-2); font-family: var(--font-mono); }
.an-w circle { fill: var(--ox); stroke: var(--surface); stroke-width: 2; }
.an-w text { fill: #fff; font-size: 11px; font-weight: 800; }
.an:hover .an-r, .an:focus .an-r, .an.sel .an-r, .an.act .an-r { stroke: var(--gc); stroke-width: 3; filter: drop-shadow(0 6px 14px rgba(15, 23, 42, .18)); }
.an:focus { outline: none; }
.g-front { --gc: #2563eb; } .g-back { --gc: #7c3aed; } .g-data { --gc: #16a34a; } .g-ext { --gc: #64748b; } .g-deploy { --gc: #ea7a12; } .g-tool { --gc: #0891b2; } .g-ml { --gc: #db2777; }
.ae-p { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 7 6; animation: flow 1.4s linear infinite; opacity: .55; transition: opacity .2s, stroke .2s, stroke-width .2s; }
.ae-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: help; }
.ae.plan .ae-p { stroke-dasharray: 3 7; animation-duration: 3s; stroke: #db2777; }
.ae-l { font-size: 12px; font-weight: 600; fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; transition: opacity .2s; }

<script>
const DATA = /*__DATA__*/null;
const UI = DATA.ui || {};
const ixDataFlow = (id) => (UI.dataFlows || []).includes(id);
const shortPath = (p) => (UI.pathShort || []).reduce((s, [a, b]) => s.split(a).join(b), p);

/* ---------- 공용 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("codereader." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("codereader." + k, JSON.stringify(v)); } catch {} }
};
const TERMS = DATA.terms;
const TERM_BY_ID = Object.fromEntries(TERMS.map((t) => [t.id, t]));
const GLOSS = DATA.glossary;
const FILES = DATA.files;
const FILE_BY_BASE = {};
FILES.forEach((f) => { f.offset = f.offset || 0; if (!FILE_BY_BASE[f.base]) FILE_BY_BASE[f.base] = f; const pb = (f.path || f.file).split("/").pop(); if (!FILE_BY_BASE[pb]) FILE_BY_BASE[pb] = f; });
// 원래 줄 번호 n의 코드 (일부 구간만 담은 파일은 offset만큼 밀려 있음)
const L = (f, n) => f.lines[n - 1 - f.offset] ?? "";
let readSet = new Set(store.get("read", []));
const rk = (f, i) => f.file + "#" + ((f.blocks[i] && f.blocks[i].fp) || i);
// 예전 기록("파일#번호")을 지문 기록으로 한 번 바꾼다
(function () {
  let moved = 0; const out = new Set();
  for (const k of readSet) {
    const m = /^(.*)#(\d+)$/.exec(k), f = m && FILES.find((x) => x.file === m[1]), b = f && f.blocks[+m[2]];
    if (b && b.fp) { out.add(f.file + "#" + b.fp); moved++; } else out.add(k);
  }
  if (moved) { readSet = out; store.set("read", [...readSet]); }
})();
const FLOWS = DATA.flows;
let state = { file: store.get("file", FILES[0].file), block: null, line: null, flow: null };
if (!FILES.find((f) => f.file === state.file)) state.file = FILES[0].file;
state.flow = FILES.find((f) => f.file === state.file).flow;
const flowFiles = (id) => FILES.filter((f) => f.flow === id);
// 이름으로 파일 찾기: 지금 보고 있는 흐름의 파일을 먼저 고른다
function findFileByName(name) {
  const cands = FILES.filter((f) => f.base === name || f.base.startsWith(name + " ") || (f.path || f.file).split("/").pop() === name);
  return cands.find((f) => f.flow === state.flow) || cands[0];
}

/* ---------- 칸 안에서만 스크롤 (페이지 전체가 튀지 않게) ---------- */
function scrollInside(container, el, where) {
  if (!container || !el) return;
  const cr = container.getBoundingClientRect(), er = el.getBoundingClientRect();
  const top = er.top - cr.top + container.scrollTop;
  const view = container.clientHeight;
  const visible = er.top >= cr.top + 40 && er.bottom <= cr.bottom - 40;
  if (where === "ifneeded" && visible) return;
  const target = where === "center" ? top - view / 2 + er.height / 2 : top - 70;
  container.scrollTo({ top: Math.max(0, target), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function scrollInsideX(container, el) {
  if (!container || !el) return;

function fileMapHtml(tour) {

  const curStep = tour.steps[tourState.step];

  const badges = (list) => list.map(([s, k]) => '<button type="button" class="sbadge' + (k === tourState.step ? " now" : "") + (seenSteps.has(tour.id + "#" + k) ? " seen" : "") + '" data-step="' + k + '" style="--lc:' + laneColor(tour, s.lane) + '" title="' + (k + 1) + ". " + esc(s.title) + '">' + (k + 1) + "</button>").join("");

  for (const [prefix, label, laneId] of roots) {
    const mine = paths.filter((p) => p.startsWith(prefix) && !roots.some(([q]) => q.length > prefix.length && q.startsWith(prefix) && p.startsWith(q)));
    if (!mine.length) continue;
    const folders = {};
    mine.forEach((p) => { const rest = p.slice(prefix.length); const dir = rest.includes("/") ? rest.slice(0, rest.lastIndexOf("/")) : "."; (folders[dir] = folders[dir] || []).push(p); });
    html += '<section class="fm-root"><div class="fm-root-h">' + (tour.lanes.find((l) => l.id === laneId) ? laneIcon(tour, laneId, 16) : icon(LANE_ICON[laneId], 16, "var(--ink-2)")) + "<b>" + label + '</b><span class="mono">' + esc(shortPath(prefix)) + "</span></div>";
    for (const dir of Object.keys(folders)) {
      html += '<div class="fm-folder"><div class="fm-folder-h">' + icon("folder", 14, "var(--ink-2)") + esc(dir === "." ? "(맨 위)" : dir) + "/</div><div class=\"fm-tiles\">";
      for (const p of folders[dir]) {
        const list = stepsOf(p), on = list.length > 0, now = curStep && curStep.file === p;
        const firstAfter = (list.find(([, k]) => k >= tourState.step) || list[0] || [])[1];
        html += '<div class="fm-tile' + (on ? " on" : "") + (now ? " now" : "") + '" data-path="' + esc(p) + '"' + (on ? ' data-first="' + firstAfter + '" role="button" tabindex="0"' : "") + ' style="--fc:' + FILE_COLOR[p] + '">' + typeBadge(p) + '<span class="fm-name">' + esc(fileName(p)) + '</span><span class="fm-badges">' + badges(list) + "</span></div>";
      }
      html += "</div></div>";
    }
    html += "</section>";
  }
  const extLanes = tour.lanes.filter((l) => tour.steps.some((s) => !s.file && s.lane === l.id));
  if (extLanes.length) {
    html += '<section class="fm-root"><div class="fm-root-h">' + icon("cloud", 16, "var(--ink-2)") + '<b>코드 밖</b><span class="mono">' + (ixDataFlow(tour.flow) ? "디스크의 데이터 파일" : "다른 회사 서버") + '</span></div><div class="fm-tiles">';
    for (const l of extLanes) {
      const list = tour.steps.map((s, k) => [s, k]).filter(([s]) => !s.file && s.lane === l.id);
      const now = curStep && !curStep.file && curStep.lane === l.id;
      html += '<div class="fm-tile on ext' + (now ? " now" : "") + '" data-lane="' + l.id + '" data-first="' + ((list.find(([, k]) => k >= tourState.step) || list[0])[1]) + '" role="button" tabindex="0" style="--fc:' + laneColor(tour, l.id) + '">' + laneIcon(tour, l.id, 16) + '<span class="fm-name">' + esc(l.name) + '</span><span class="fm-badges">' + badges(list) + "</span></div>";
    }
    html += "</div></section>";
  }

}
// 파일 지도 위에 "방금 온 곳 → 지금 → 다음" 화살표
function drawRoute(tour) {

  const mr = map.getBoundingClientRect();
  svg.setAttribute("width", map.scrollWidth); svg.setAttribute("height", map.scrollHeight);
  const center = (el) => { const r = el.getBoundingClientRect(); return [r.left - mr.left + Math.min(r.width - 18, 120), r.top - mr.top + r.height / 2]; };
  const i = tourState.step, prev = tileOf(tour.steps[i - 1]), cur = tileOf(tour.steps[i]), next = tileOf(tour.steps[i + 1]);
  let out = '<defs><marker id="fma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker><marker id="fmb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker></defs>';
  const arc = (a, b, solid) => {

/* 한눈에 보는 큰 그림: 칸(장소) × 시간 순서, 상자마다 파일 */

function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

// 핵심 단어: 해설에서 두 글자 이상 낱말(조사 떼기) — 내 답과 겹치는 정도를 본다
const STOP = new Set("이 줄 줄은 줄이 것 것을 것이 거예요 있어요 해요 돼요 이에요 예요 그 이 저 수 때 더 또 를 을 는 은 가 이런 그래서 그러면 여기 여기서 이것 하는 한다 하고 해서 있는 없는 있게 쓰는 써요 만들어요 받아요 돌려줘요 넣어요 같은 위해 위한 바로 다시 먼저 그대로 함수 값 변수".split(" "));
function keyWords(text) {
  const plain = String(text || "").replace(/\[\[([a-z0-9-]+)\]\]/g, (m, id) => " " + (TERM_BY_ID[id] ? TERM_BY_ID[id].label : id) + " ").replace(/`/g, " ");
  const out = [];
  for (let w of plain.split(/[^0-9A-Za-z가-힣_.]+/)) {
    w = w.replace(/^[.]+|[.]+$/g, "").replace(/(으로|에서|에게|까지|부터|처럼|이라|이고|이면|하고|라고|으로써|에는|에도|보다|은|는|이|가|을|를|의|에|로|와|과|도|만)$/, "");
    if (w.length < 2 || STOP.has(w) || /^\d+$/.test(w)) continue;
    if (!out.includes(w)) out.push(w);
  }
  return out.slice(0, 14);
}
function compareAnswer(mine, answer) {
  const keys = keyWords(answer);

  const hit = keys.filter((k) => low.includes(k.toLowerCase()));
  return { keys, hit };
}

  document.addEventListener("mousemove", (e) => {

    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - w - 8)) + "px";

}

/* ---- 프로젝트 역사: 주별 커밋 그래프 + 단계 막대 + 시간 슬라이더 ---- */
const HS_COLORS = ["#3b82f6", "#f97316", "#22c55e", "#a855f7", "#ec4899", "#14b8a6"];
let hsPhase = null, hsDay = null;
const hsDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function hsModel() {
  const m = PMAP.history || {};
  const commits = (PMAP.commits || []).map((c) => ({ d: hsDate(c.d), a: c.a })).sort((a, b) => a.d - b.d);
  const phases = (m.phases || []).map((p) => { const [s, e] = String(p.period).split("~").map((x) => x.trim()); return { ...p, s: hsDate(s), e: hsDate(e || s) }; });
  const all = [...commits.map((c) => c.d), ...phases.flatMap((p) => [p.s, p.e])];
  const t0 = new Date(Math.min(...all)), t1 = new Date(Math.max(...all));
  t0.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));
  const days = Math.round((t1 - t0) / 864e5) + 7;
  const authors = ((m.stats && m.stats.byAuthor) || []).map((a) => a.name);
  commits.forEach((c) => { if (!authors.includes(c.a)) authors.push(c.a); });
  const weeks = Math.ceil(days / 7), bins = Array.from({ length: weeks }, () => ({}));
  commits.forEach((c) => { const w = Math.floor((c.d - t0) / 864e5 / 7); bins[w][c.a] = (bins[w][c.a] || 0) + 1; });
  return { m, commits, phases, t0, days, authors, bins };
}
function mxHistory() {
  const H = hsModel(), m = H.m;
  if (!m.phases) return none("역사");
  const W = 1180, L = 150, R = 20, CH = 150, top = 20, PH = 22, plotW = W - L - R;
  const x = (d) => L + (d - H.t0) / 864e5 / H.days * plotW;
  const wx = plotW / (H.days / 7);
  const maxB = Math.max(1, ...H.bins.map((b) => Object.values(b).reduce((a, v) => a + v, 0)));
  const yb = (v) => v / maxB * CH;
  const ph0 = top + CH + 34, Hh = ph0 + H.phases.length * PH + 16;
  let svg = '<svg class="hs" id="hsSvg" viewBox="0 0 ' + W + " " + Hh + '">';
  for (let v = 0; v <= maxB; v += Math.max(1, Math.ceil(maxB / 4))) svg += '<line class="hs-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + (top + CH - yb(v)) + '" y2="' + (top + CH - yb(v)) + '"/><text class="hs-ax" x="' + (L - 8) + '" y="' + (top + CH - yb(v) + 4) + '" text-anchor="end">' + v + "</text>";
  svg += '<text class="hs-ax" x="' + (L - 8) + '" y="' + (top - 6) + '" text-anchor="end">주별 커밋</text>';
  H.bins.forEach((b, i) => {
    let y = top + CH; const tot = Object.values(b).reduce((a, v) => a + v, 0); if (!tot) return;
    const ws = new Date(H.t0); ws.setDate(ws.getDate() + i * 7);
    const tip = "<b>" + ixDay(ws) + " 주</b> · 커밋 " + tot + "<br>" + H.authors.filter((a) => b[a]).map((a) => esc(a) + " " + b[a]).join(" · ");
    svg += '<g class="hs-bar" data-w="' + i + '"' + tipAttr(tip) + ">";
    H.authors.forEach((a, ai) => { if (!b[a]) return; const hgt = yb(b[a]); y -= hgt; svg += '<rect x="' + (L + i * wx + 1).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(2, wx - 2).toFixed(1) + '" height="' + hgt.toFixed(1) + '" fill="' + HS_COLORS[ai % HS_COLORS.length] + '" rx="2"/>'; });
    svg += "</g>";
  });
  // 달 눈금
  const mm = new Date(H.t0.getFullYear(), H.t0.getMonth() + 1, 1), end = new Date(H.t0); end.setDate(end.getDate() + H.days);
  for (; mm <= end; mm.setMonth(mm.getMonth() + 1)) svg += '<line class="hs-mon" x1="' + x(mm) + '" x2="' + x(mm) + '" y1="' + top + '" y2="' + (Hh - 10) + '"/><text class="hs-ax" x="' + (x(mm) + 4) + '" y="' + (top + CH + 18) + '">' + (mm.getMonth() + 1) + "월</text>";
