<!-- 「▶ 실행 따라가기」: 화면에서 무언가를 누르면 어떤 함수가 어떤 순서로 실행되고, 값이 어떻게 바뀌고,
     무엇을 기다리는지(await) 한 칸씩 따라간다. 오른쪽에 지금 실행 중인 함수의 코드 · 그 순간의 값 · 그 순간의 화면.
     데이터: labs/<id>.json 의 events[].steps (k: event · call · line · set · await · resume · return · render · effect · end)
     화면 그림: labs/<id>.js 의 LAB.register(id, { init, examples, derive, render }).
     build.js 가 이 파일과 labs/*.js 를 템플릿 끝의 LABS 자리표시에 넣는다. 데이터는 DATA.labs. -->

.lb-sheethead{display:flex;justify-content:space-between;align-items:center}
.lb-card{background:#f1f5f9;border-radius:10px;padding:8px 10px;font-size:13px}
.lb-chip{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:1px 7px;font-size:12px;margin-top:3px}
</style>
<div class="lab-ov" id="labOv" hidden></div>
<script>
"use strict";
const LAB = { defs: {}, register(id, def) { this.defs[id] = def; } };
const LABS = (DATA.labs || []);
const lrich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
const lclone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
function labFor(path) { return LABS.find((l) => l.file === path && LAB.defs[l.id]); }

let LX = null;
/* ── 한 이벤트의 단계를 미리 끝까지 흉내 내서, 단계마다 그 순간의 모습(스냅숏)을 만든다 */
function labSim(meta, def, ev) {
  const ex = def.examples || {};
  const val = (v) => (typeof v === "string" && v[0] === "$" && ex[v.slice(1)] !== undefined ? lclone(ex[v.slice(1)]) : v);
  const S = Object.assign(lclone(def.init), ...Object.entries(ev.start || {}).map(([k, v]) => ({ [k]: val(v) })));
  const P = new Map(); let stack = [], susp = [], waitWhat = null;
  let off = 0, sec = null, secBase = 0; // 서버 구간: 들여쓰기 시작점 · 구간 번호(enter 단계 위치)
  const touched = new Set(Object.keys(ev.start || {}));
  const snaps = [];
  ev.steps.forEach((st, si) => {
    const an = meta.anchors[st.a] || null; const file = (an && an.file) || meta.file;
    let depth = stack.length, info = {};
    if (st.k === "enter") { secBase = susp.length; sec = si; off = secBase + 1; info.appWait = susp.map((f) => f.fn); }
    if (st.k === "call" || st.k === "effect") {
      depth = stack.length;
      stack = stack.concat([{ fn: st.fn, a: st.a, file, body: an && an.body, vars: Object.assign({}, st.args || {}) }]);
    } else if (st.k === "return") {
      depth = Math.max(0, stack.length - 1); info.value = st.value; stack = stack.slice(0, -1);
    } else if (st.k === "await") {
      info.waitFor = stack.map((f) => f.fn); susp = stack; stack = []; waitWhat = st.what;
    } else if (st.k === "resume") {
      if (!stack.length && susp.length) { stack = susp; susp = []; } waitWhat = null; depth = stack.length;
    } else if (st.k === "set") {
      touched.add(st.state);
      const from = P.has(st.state) ? P.get(st.state) : S[st.state]; const to = val(st.to);
      info.from = from; info.to = to; info.same = JSON.stringify(from) === JSON.stringify(to);
      if (!info.same) P.set(st.state, to);
    } else if (st.k === "block") { info.blockIn = stack.length ? stack[stack.length - 1].fn : ""; waitWhat = st.what;
    } else if (st.k === "render" || st.k === "event" || st.k === "end") depth = 0;
    if (st.k !== "block" && st.k !== "await" && st.k !== "enter" && waitWhat && sec !== null) waitWhat = null;
    if (st.k === "render" && !st.skip) {
      const before = lclone(S); info.changed = [];
      for (const [k, v] of P) if (JSON.stringify(S[k]) !== JSON.stringify(v)) { S[k] = v; info.changed.push(k); }
      P.clear(); info.before = before;
      const Db = def.derive(before), Da = def.derive(S);
      info.dchanged = Object.keys(Da).filter((k) => JSON.stringify(Da[k]) !== JSON.stringify(Db[k]));
    }
    if (st.vars && stack.length) Object.assign(stack[stack.length - 1].vars, st.vars);
    if (st.k === "await") depth = info.waitFor.length;
    const inSec = sec !== null;
    if (inSec && st.k !== "enter" && st.k !== "leave") depth += off;
    if (st.k === "enter" || st.k === "leave") depth = secBase;
    const side = st.k === "enter" || (inSec && st.k !== "leave") ? (st.ext ? "ext" : "server") : (st.ext ? "ext" : "app");
    snaps.push({ st, an, file, depth, info, side, sec: inSec && st.k !== "enter" && st.k !== "leave" ? sec : null, S: lclone(S), P: new Map([...P].map(([k, v]) => [k, lclone(v)])), stack: lclone(stack), suspFrames: lclone(susp), susp: susp.map((f) => f.fn), waitWhat, touched: [...touched] });
    if (st.k === "leave") { sec = null; off = 0; waitWhat = null; }
  });
  // 서버 구간마다 단계 수
  snaps.forEach((sn, i) => { if (sn.st.k === "enter") sn.info.count = snaps.filter((x) => x.sec === i).length; });
  return snaps;
}

function openLab(id, evId) {
  const meta = LABS.find((l) => l.id === id), def = LAB.defs[id]; if (!meta || !def) return;
  if (LX) closeLab();
  LX = { meta, def, ev: null, snaps: [], i: 0, timer: null, expand: !!store.get("lab.server", false) };
  const ov = $("#labOv"); ov.hidden = false; document.body.style.overflow = "hidden";
  ov.innerHTML = `<div class="lab-head"><span style="font-size:20px">${esc(meta.icon || "🧭")}</span><h2>${esc(meta.title)}</h2><span class="lab-badge" title="${esc(meta.note || "")}">코드를 읽고 따라간 순서 ⓘ</span><span class="lab-sp"></span><button class="lab-x" id="labClose">✕ 닫기</button></div>
    <div class="lab-evs" id="labEvs">${(meta.events || []).map((e) => `<button class="lab-ev" data-e="${e.id}">${esc(e.icon || "👆")} ${esc(e.title)}</button>`).join("")}</div>
    <div class="lab-evintro" id="labEvIntro"></div>
    <div class="lab-body">
      <div class="lab-col">
        <div class="lab-ctl"><button class="lab-x" id="labFirst" title="처음 (Home)">⏮</button><button class="lab-x" id="labPrev" title="이전 (←)">◀ 이전</button><button class="lab-x main" id="labNext" title="다음 (→ 또는 Space)">다음 ▶</button><button class="lab-x" id="labAuto" title="자동으로 넘기기">⏯ 자동</button><button class="lab-x" id="labSrv" title="서버 안에서 일어나는 일까지 펼쳐서 따라가요"></button><span class="pos" id="labPos"></span></div>
        <div class="lab-card lab-tl" id="labTl"></div>
      </div>
      <div class="lab-col rt">
        <div class="lab-where" id="labWhere"></div>
        <div class="lab-card"><div class="lab-codehd" id="labCodeHd"></div><div class="lab-code" id="labCode"></div><div class="lab-say" id="labSay"></div></div>
        <div class="lab-bottom"><div class="lab-card lab-vals" id="labVals"></div><div class="lab-card lab-shot"><div class="lab-k">이 순간의 화면</div><div class="lab-thumb" id="labShot"></div><div class="cap" id="labShotCap"></div></div></div>
      </div>
    </div>`;
  $("#labClose").onclick = closeLab;
  ov.querySelectorAll(".lab-ev").forEach((b) => b.onclick = () => labPick(b.dataset.e));
  $("#labFirst").onclick = () => labGo(0); $("#labPrev").onclick = () => labStepTo(-1); $("#labNext").onclick = () => labStepTo(1);
  $("#labSrv").onclick = () => labToggleServer(!LX.expand);
  $("#labAuto").onclick = labAuto;
  $("#labTl").addEventListener("click", (e) => { if (e.target.closest(".lab-fold")) { labToggleServer(!LX.expand); return; } const r = e.target.closest(".lab-row"); if (r) labGo(+r.dataset.i); });
  $("#labShot").addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); const ev = el && (meta.events || []).find((x) => x.ui === el.dataset.a); if (ev) labPick(ev.id); });
  document.addEventListener("keydown", labKey);
  labPick(evId || (meta.events[0] && meta.events[0].id));
}
function closeLab() { if (!LX) return; clearInterval(LX.timer); LX = null; $("#labOv").hidden = true; $("#labOv").innerHTML = ""; document.body.style.overflow = ""; document.removeEventListener("keydown", labKey); }
function labKey(e) {
  if (!LX) return;
  if (e.key === "Escape") closeLab();
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); labStepTo(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); labStepTo(-1); }
  else if (e.key === "Home") labGo(0);
}
function labVisible(i) { const sn = LX.snaps[i]; return sn.sec === null || LX.expand; }
function labStepTo(dir) { let i = LX.i + dir; while (i >= 0 && i < LX.snaps.length && !labVisible(i)) i += dir; if (i >= 0 && i < LX.snaps.length) labGo(i); }
function labToggleServer(on) { LX.expand = on; store.set("lab.server", on); $("#labSrv").classList.toggle("on", on); $("#labSrv").textContent = on ? "🖥️ 서버까지 같이 보기 ✓" : "🖥️ 서버까지 같이 보기";
  if (!labVisible(LX.i)) { let i = LX.i; while (i > 0 && !labVisible(i)) i--; LX.i = i; } labTimeline(); labGo(LX.i); }
function labPick(evId) {
  const ev = LX.meta.events.find((e) => e.id === evId); if (!ev) return;
  clearInterval(LX.timer); LX.timer = null; $("#labAuto").classList.remove("on");
  LX.ev = ev; LX.snaps = labSim(LX.meta, LX.def, ev);
  document.querySelectorAll(".lab-ev").forEach((b) => b.classList.toggle("on", b.dataset.e === evId));
  $("#labEvIntro").innerHTML = lrich(ev.intro || "");
  $("#labSrv").hidden = !LX.snaps.some((s) => s.st.k === "enter"); $("#labSrv").classList.toggle("on", LX.expand); $("#labSrv").textContent = LX.expand ? "🖥️ 서버까지 같이 보기 ✓" : "🖥️ 서버까지 같이 보기";
  labTimeline(); labGo(0);
}
function labAuto() {
  if (LX.timer) { clearInterval(LX.timer); LX.timer = null; $("#labAuto").classList.remove("on"); return; }
  if (LX.i >= LX.snaps.length - 1) labGo(0);
  $("#labAuto").classList.add("on");
  LX.timer = setInterval(() => { if (!LX) return; if (LX.i >= LX.snaps.length - 1) { clearInterval(LX.timer); LX.timer = null; $("#labAuto").classList.remove("on"); return; } labStepTo(1); }, 2200);
}

/* ── 왼쪽: 실행 순서 */
const LAB_IC = { enter: "🖥️", leave: "📱", block: "⏸", event: "👆", call: "▶", line: "•", set: "✏️", await: "⏸", resume: "▶︎", return: "◀", render: "🎨", effect: "⚙️", end: "🏁" };
function labFmt(v, max = 34) {
  let s;
  if (v === null || v === undefined) s = String(v);
  else if (typeof v === "string") s = '"' + v + '"';
  else if (Array.isArray(v)) s = "[" + v.map((x) => typeof x === "object" && x ? (x.word || x.questionText || "{…}") : String(x)).join(", ") + "]";
  else if (typeof v === "object") { const k = Object.keys(v); s = k.length === 0 ? "{}" : v.items ? `{ 단어 ${v.items.length}개 }` : `{ ${k.length}개 }`; }
  else s = String(v);
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}
function labFileShort(f) { return f.split("/").pop(); }
function labTimeline() {
  $("#labTl").innerHTML = LX.snaps.map((sn, i) => {
    const st = sn.st, an = sn.an; const ln = an ? `<span class="fl">${esc(labFileShort(sn.file))} ${an.l[0]}</span>` : "";
    let tx;
    if (st.k === "call" || st.k === "effect") tx = `<span class="fn">${esc(st.fn)}</span>${ln}<div class="say">${lrich(st.say || "")}</div>`;
    else if (st.k === "set") tx = `${lrich(st.say)}${ln}<div class="ch"><span>${esc(st.state)}:</span> ${sn.info.same ? `${esc(labFmt(sn.info.from))} <span class="lab-k">(그대로)</span>` : `<s>${esc(labFmt(sn.info.from))}</s> → <b>${esc(labFmt(sn.info.to))}</b> <span class="lab-k">· 다음 그리기 때 반영</span>`}</div>`;
    else if (st.k === "enter") tx = `<b>${lrich(st.say)}</b><div><button class="lab-x lab-fold" type="button">${LX.expand ? "▾ 서버 구간 접기" : "▸ 서버 안에서 일어난 일 " + sn.info.count + "칸 펼치기"}</button></div>`;
    else if (st.k === "block") tx = `${lrich(st.say)}${ln}<div class="wt">${st.ext ? "🌐 " : ""}기다리는 것: <b>${esc(st.what)}</b> — <i>그 줄에서 멈춰 기다려요</i>${st.during ? `<br>${lrich(st.during)}` : ""}</div>`;
    else if (st.k === "await") tx = `${lrich(st.say)}${ln}<div class="wt">기다리는 것: <b>${esc(st.what)}</b>${st.during ? `<br>그동안: ${lrich(st.during)}` : ""}</div>`;
    else if (st.k === "render") tx = `${lrich(st.say)}${sn.info.changed && sn.info.changed.length ? `<div class="ch">${sn.info.changed.map((k) => `${esc(k)}: <s>${esc(labFmt(sn.info.before[k], 18))}</s> → <b>${esc(labFmt(sn.S[k], 18))}</b>`).join(" · ")}</div>` : ""}`;
    else if (st.k === "return") tx = `${lrich(st.say || "끝")}${sn.info.value ? `<div class="ch">돌려줌: <b>${esc(sn.info.value)}</b></div>` : ""}`;
    else tx = `${lrich(st.say || "")}${ln}`;
    return `<div class="lab-row k-${st.k} ${sn.side !== "app" ? "sv" : ""} ${sn.sec !== null && !LX.expand ? "hid" : ""}" data-i="${i}"><span class="ind">${"<i></i>".repeat(sn.depth)}</span><span class="ic">${LAB_IC[st.k] || "•"}</span><span class="tx">${tx}</span></div>`;
  }).join("");
}

/* ── 한 단계 보여 주기 */
function labGo(i) {
  if (!LX || !LX.snaps.length) return;
  i = Math.max(0, Math.min(LX.snaps.length - 1, i)); LX.i = i;
  const sn = LX.snaps[i];
  document.querySelectorAll("#labTl .lab-row").forEach((r, k) => { r.classList.toggle("cur", k === i); r.classList.toggle("fut", k > i); });
  const cur = document.querySelector(`#labTl .lab-row[data-i="${i}"]`); labScrollIn($("#labTl"), cur, false);
  const vis = LX.snaps.map((_, k) => k).filter(labVisible); const vi = vis.indexOf(i);
  $("#labPos").textContent = `${vi + 1} / ${vis.length}`;
  $("#labPrev").disabled = vi <= 0; $("#labNext").disabled = vi === vis.length - 1;
  labCode(sn); labVals(sn); labShot(sn);
  $("#labWhere").innerHTML = `지금 실행되는 곳: <span class="${sn.side === "app" ? "on" : ""}">📱 앱(휴대폰)</span><span class="${sn.side === "server" ? "on server" : ""}">🖥️ 우리 서버</span><span class="${sn.side === "ext" ? "on ext" : ""}">🌐 바깥 서비스</span>`;
  $("#labSay").innerHTML = `${LAB_IC[sn.st.k] || ""} ${lrich(sn.st.say || "")}`;
}
function labScrollIn(box, el, center) { // 그 칸 안에서만 스크롤한다
  if (!box || !el) { if (box && center) box.scrollTop = 0; return; }
  const top = el.offsetTop, h = el.offsetHeight; // 칸이 position:relative 라서 칸 기준 위치
  if (center) box.scrollTop = Math.max(0, top - box.clientHeight / 2 + h / 2);
  else if (top < box.scrollTop) box.scrollTop = top - 8;
  else if (top + h > box.scrollTop + box.clientHeight) box.scrollTop = top + h - box.clientHeight + 8;
}
function labSrc(file) { const s = LX.meta.src || {}; return s[file] || (file === LX.meta.file ? s : {}) || {}; }
function labCode(sn) {
  const m = LX.meta, st = sn.st, an = sn.an;
  const top = sn.stack[sn.stack.length - 1] || (st.k === "await" ? sn.suspFrames[sn.suspFrames.length - 1] : null);
  let file, range, title;
  if (an && an.body && (st.k === "call" || st.k === "effect")) { file = sn.file; range = an.body; title = st.fn; }
  else if (top && top.body && (st.k !== "render" && st.k !== "event" && st.k !== "end")) { file = top.file; range = top.body; title = top.fn; }
  else if (st.k === "enter" || st.k === "leave") { $("#labCodeHd").innerHTML = `<b>${st.k === "enter" ? "🖥️ 서버로 넘어가요" : "📱 앱으로 돌아가요"}</b><span>인터넷(HTTP)을 건너는 곳</span>`; $("#labCode").innerHTML = ""; return; }
  else if (st.k === "render") { file = m.file; const ls = (m.states || []).map((s) => s.line); range = [Math.min(...ls), Math.max(...ls)]; title = "화면 함수가 처음부터 다시 실행 — 상태들"; }
  else if (an) { file = sn.file; const rs = ((m.sources || {})[file] || []).find(([a, b]) => an.l[0] >= a && an.l[0] <= b); range = rs || an.l; title = st.k === "event" ? "버튼에 연결된 코드" : ""; }
  if (!range) { $("#labCodeHd").innerHTML = `<span>코드 없음</span>`; $("#labCode").innerHTML = ""; return; }
  const src = labSrc(file);
  const hl = an && (an.file || m.file) === file ? an.l : null;
  const changedLines = st.k === "render" && sn.info.changed ? (m.states || []).filter((s) => sn.info.changed.includes(s.name)).map((s) => s.line) : [];
  let h = "";
  for (let l = range[0]; l <= range[1]; l++) {
    if (src[l] === undefined) continue;
    const run = (hl && l >= hl[0] && l <= hl[1]) || changedLines.includes(l);
    h += `<div class="lab-lc ${run ? (st.k === "await" ? "wait run" : "run") : ""}" data-l="${l}"><span class="n">${l}</span><span>${esc(src[l])}</span></div>`;
  }
  $("#labCodeHd").innerHTML = `<b>${esc(title || "")}</b><span>${esc(file)}${range ? ` · ${range[0]}–${range[1]}줄` : ""}</span>`;
  $("#labCode").innerHTML = h;
  labScrollIn($("#labCode"), document.querySelector("#labCode .lab-lc.run"), true);
}
function labVals(sn) {
  const m = LX.meta; const st = sn.st; const top = sn.stack[sn.stack.length - 1];
  let h = "";
  if (sn.sec !== null || st.k === "enter") h += `<div class="lab-waitbox">📱 앱: <b>${esc(sn.susp.join(" → "))}</b> 가 서버 답을 기다리는 중 — 화면은 그대로예요</div>`;
  if (st.k === "block") h += `<div class="lab-waitbox">⏸ <b>${esc(sn.info.blockIn)}</b> 가 이 줄에서 멈춰 기다리는 중: ${esc(st.what)}</div>`;
  if (sn.sec === null && st.k !== "enter" && (sn.susp.length || st.k === "await")) h += `<div class="lab-waitbox">⏸ <b>${esc((st.k === "await" ? sn.info.waitFor : sn.susp).join(" → ") || "아무 함수도")}</b> 가 멈춰서 기다리는 중: ${esc(sn.waitWhat || "")}</div>`;
  if (top) {
    const vars = Object.entries(top.vars || {});
    h += `<div><div class="lab-k">지금 실행 중인 함수</div><div class="lab-stack"><b>${esc(top.fn)}</b>${sn.stack.length > 1 ? ` ← 불러 준 곳: ${sn.stack.slice(0, -1).reverse().map((f) => `<b>${esc(f.fn)}</b>`).join(" ← ")}` : ""}</div></div>`;
    if (vars.length) h += `<div><div class="lab-k">이 함수 안의 값 (변수)</div><div class="lab-vt">${vars.map(([k, v]) => `<span class="nm">${esc(k)}</span><span class="vl ${st.vars && k in st.vars ? "nw" : ""}">${esc(v)}</span>`).join("")}</div></div>`;
  } else if (!sn.susp.length) h += `<div class="lab-stack">지금 실행 중인 함수: <b>없음</b> (React 가 화면을 그리거나, 다음 일을 기다리는 중)</div>`;
  const names = (m.states || []).filter((s) => sn.touched.includes(s.name) || sn.P.has(s.name));
  if (names.length) h += `<div><div class="lab-k">상태 (useState) — 화면을 그리는 값</div><div class="lab-vt">${names.map((s) => { const p = sn.P.has(s.name); const ch = st.k === "render" && sn.info.changed && sn.info.changed.includes(s.name);
      return `<span class="nm">${esc(s.name)}</span><span class="vl ${ch ? "nw" : ""}" title="${esc(s.say)}">${esc(labFmt(sn.S[s.name]))}${p ? ` <span class="pd">→ ${esc(labFmt(sn.P.get(s.name), 18))} ⏳</span>` : ""}</span>`; }).join("")}</div>
      ${[...sn.P.keys()].length ? `<div class="lab-stack">⏳ 표시 = 바꿔 달라고 부탁만 한 값. 다음 🎨 다시 그리기 때 화면에 반영돼요.</div>` : ""}</div>`;
  $("#labVals").innerHTML = h || `<div class="lab-stack">아직 값이 없어요</div>`;
}
function labShot(sn) {
  const t = $("#labShot"); const def = LX.def;
  t.innerHTML = `<div class="lab-phone">${def.render(sn.S, def.derive(sn.S), esc)}</div>`;
  const st = sn.st; let cap = "";
  if (st.k === "event" && LX.ev.ui) { t.querySelectorAll(`[data-a="${LX.ev.ui}"]`).forEach((x) => x.classList.add("lb-tap")); cap = "👆 여기를 눌렀어요"; }
  else if (st.k === "render" && sn.info.changed) {
    const names = sn.info.changed.concat(sn.info.dchanged || []);
    t.querySelectorAll("[data-dep]").forEach((el) => { if (el.dataset.dep.split(",").some((d) => names.includes(d))) el.classList.add("lb-ring"); });
    cap = st.skip ? "바뀐 값이 없어서 화면은 그대로예요" : (sn.info.changed.length ? "🎨 빨간 테두리 = 이번에 다시 그려져 달라진 곳" : "바뀐 값이 없어서 화면은 그대로예요");
  } else if (sn.P.size) cap = "아직 그대로예요 — 바꿔 달라는 부탁(⏳)은 다음 🎨 때 반영돼요";
  else if (sn.sec !== null || st.k === "enter" || st.k === "leave") cap = "🖥️ 서버가 일하는 동안 앱 화면은 그대로예요";
  else if (sn.susp.length || st.k === "await") cap = "기다리는 동안의 화면";
  $("#labShotCap").textContent = cap;
  const ph = t.firstElementChild; t.style.width = ph.offsetWidth * .62 + "px"; t.style.height = ph.offsetHeight * .62 + "px";
}
window.LABX = { open: openLab, close: closeLab, go: (i) => labGo(i), pick: (e) => labPick(e), get X() { return LX; } };
function labButton(f) { const l = f && labFor(f.path); return l ? `<button class="lab-open" type="button" data-lab="${l.id}" title="버튼을 누르면 어떤 함수가 어떤 순서로 실행되는지 따라가요">▶ 실행 따라가기</button>` : ""; }
function labBoot() { // 첫 화면은 이 스크립트보다 먼저 그려졌으니 버튼을 한 번 붙여 준다
  const f = FILES.find((x) => x.file === state.file); const ct = document.querySelector("#center .code-tools");
  if (ct && !ct.querySelector(".lab-open") && labButton(f)) { ct.insertAdjacentHTML("beforeend", labButton(f)); ct.querySelector(".lab-open").onclick = () => openLab(ct.querySelector(".lab-open").dataset.lab); }
  const want = (location.hash || "").match(/^#lab-([A-Za-z0-9_-]+)$/); if (want) openLab(want[1]);
}
</script>
